<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Công cụ ước tính chi phí cứu kéo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* pt-mobile-2 */
@media (max-width:760px){
.pt-calc{padding:14px !important;gap:18px !important;border-radius:22px !important;grid-template-columns:minmax(0,1fr) !important}
.pt-calc-in{gap:16px !important}
.pt-calc-in > div{gap:8px !important}
.pt-calc-step > span:first-child{width:24px !important;height:24px !important;font-size:12px !important}
.pt-calc-step > span:last-child{font-size:16px !important}
.pt-calc-loc{height:46px !important;font-size:14px !important}
.pt-calc-status{font-size:12px !important}
.pt-calc-kmbox{padding:10px 12px !important;border-radius:16px !important;gap:6px !important}
.pt-calc-kmbox label{font-size:13px !important}
.pt-calc-kmbox input[type=number]{height:44px !important;width:84px !important}
.pt-calc-sel{height:48px !important}
.pt-calc-addr{padding:10px 12px !important;font-size:12px !important;border-radius:14px !important}
.pt-calc-fn{font-size:11px !important}
.pt-calc-out{display:grid !important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px !important}
.pt-calc-out > .pt-calc-step,.pt-calc-out > .pt-calc-km,.pt-calc-out > .pt-calc-call,.pt-calc-out > .pt-calc-fn{grid-column:1 / -1}
.pt-calc-km{padding:12px 14px !important;border-radius:16px !important}
.pt-calc-kmt{font-size:34px !important}
.pt-calc-pack,.pt-calc-pay{padding:14px 12px !important;border-radius:16px !important;gap:6px !important;min-width:0}
.pt-calc-packhd{flex-direction:column;align-items:flex-start !important;gap:6px !important}
.pt-calc-lbl{font-size:10px !important;letter-spacing:.03em !important}
.pt-calc-reg{font-size:12px !important;padding:0 12px !important}
.pt-calc-packt{font-size:24px !important}
.pt-calc-note{font-size:11px !important;padding:4px 8px !important;border-radius:10px !important}
.pt-calc-payt{font-size:18px !important}
.pt-calc-bd{font-size:12px !important}
.pt-calc-call{min-height:48px !important;font-size:15px !important}
}
/* pt-calc-fit */
@media (max-width:760px){
.pt-calc{padding:10px 12px !important;gap:8px !important;border-radius:18px !important}
.pt-calc-in{gap:8px !important}
.pt-calc-in > div{gap:5px !important}
.pt-calc-step{gap:6px !important}
.pt-calc-step > span:first-child{width:20px !important;height:20px !important;font-size:11px !important;flex:none}
.pt-calc-step > span:last-child{font-size:13.5px !important;line-height:1.25}
.pt-calc-loc{height:40px !important;font-size:13.5px !important}
.pt-calc-idle{display:none}
.pt-calc-kmbox{padding:6px 10px !important;border-radius:12px !important;gap:2px !important}
.pt-calc-kmbox label{font-size:12px !important}
.pt-calc-kmbox input[type=number]{height:36px !important;width:68px !important;padding:0 10px !important;font-size:15px !important}
.pt-calc-sel{height:42px !important;padding:0 14px !important;font-size:14px !important}
.pt-calc-out{gap:6px !important}
.pt-calc-km{padding:4px 12px !important;border-radius:12px !important;flex-wrap:nowrap !important;align-items:center !important}
.pt-calc-km > span:first-child{font-size:12px !important;line-height:1.3}
.pt-calc-kmt{font-size:26px !important;white-space:nowrap}
.pt-calc-reg{display:none !important}
.pt-calc-pack,.pt-calc-pay{padding:8px 10px !important;border-radius:12px !important;gap:3px !important}
.pt-calc-packhd{gap:0 !important}
.pt-calc-lbl{font-size:9.5px !important;line-height:1.25}
.pt-calc-packt{font-size:20px !important}
.pt-calc-payt{font-size:16px !important}
.pt-calc-note{font-size:10.5px !important;line-height:1.3;padding:2px 6px !important;border-radius:6px !important}
.pt-calc-bd{font-size:10.5px !important;line-height:1.3}
}
</style>
</helmet>
<div class="pt-calc" style="width:100%;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;color:#000;background:#fff;border:1.5px solid #F7B4B7;border-radius:32px;padding:clamp(18px,3vw,32px);box-shadow:0 16px 50px rgba(227,18,27,.1);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start">

  <!-- INPUTS -->
  <div class="pt-calc-in" style="display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="pt-calc-step" style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px">1</span><span style="font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600">Vị trí của bạn</span></div>
      <button class="pt-calc-loc" type="button" onClick="{{locate}}" style="display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border:0;border-radius:100px;background:#111;color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path><circle cx="12" cy="12" r="7"></circle></svg>
        <span>{{locateLabel}}</span>
      </button>
      <div class="pt-calc-status {{statusCls}}" style="font-size:13px;line-height:1.5;color:{{statusColor}}">{{statusText}}</div>
      <div class="pt-calc-kmbox" style="display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#F6F6F6;border-radius:20px">
        <label for="pt-km" style="font-size:14px;font-weight:600">Hoặc nhập khoảng cách (km)</label>
        <div style="display:flex;gap:14px;align-items:center">
          <input id="pt-km" type="number" min="0" max="500" value="{{kmValue}}" onChange="{{onKm}}" style="width:96px;height:46px;box-sizing:border-box;padding:0 14px;border:1.5px solid #DADADA;border-radius:100px;font-family:'Inter',sans-serif;font-size:16px;font-weight:700">
          <input type="range" min="0" max="200" value="{{kmValue}}" onChange="{{onKm}}" aria-label="Kéo để chọn số km" style="flex-grow:1;accent-color:#E3121B">
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="pt-calc-step" style="display:flex;align-items:center;gap:10px"><span style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, rgb(242, 34, 43), rgb(158, 0, 18)); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center; font-family: &quot;Inter Tight&quot;, sans-serif; font-weight: 700; font-size: 14px">2</span><span style="font-family: &quot;Inter Tight&quot;, sans-serif; font-size: 19px; font-weight: 600">Chọn đại lý cứu kéo xe của bạn</span></div>
      <label for="pt-dealer" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Đại lý nhận xe</label>
      <select class="pt-calc-sel" id="pt-dealer" value="{{pickedValue}}" onChange="{{onPick}}" style="height:56px;box-sizing:border-box;padding:0 20px;border:1.5px solid #E3121B;border-radius:100px;background:#fff;font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:#000;cursor:pointer">
        <option value="">Chọn đại lý nhận xe…</option>
        <sc-for list="{{dealers}}" as="d" hint-placeholder-count="10"><option value="{{d.id}}">{{d.label}}</option></sc-for>
      </select>


    </div>
  </div>

  <!-- RESULTS -->
  <div class="pt-calc-out" style="display:flex;flex-direction:column;gap:16px">
    <div class="pt-calc-step" style="display:flex;align-items:center;gap:10px"><span style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, rgb(242, 34, 43), rgb(158, 0, 18)); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center; font-family: &quot;Inter Tight&quot;, sans-serif; font-weight: 700; font-size: 14px">3</span><span style="font-family: &quot;Inter Tight&quot;, sans-serif; font-size: 19px; font-weight: 600">{{step3Title}}</span></div>

    <div class="pt-calc-km" style="padding:22px 24px;background:#F6F6F6;border-radius:24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 12px">
      <span style="font-size:14px;color:#555">{{routeLabel}}</span>
      <span class="pt-calc-kmt" style="font-family:'Inter Tight',sans-serif;font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,#9E0012,#F2222B);-webkit-background-clip:text;background-clip:text;color:transparent">{{kmText}}</span>
    </div>

    <div class="pt-calc-pack" style="padding:26px 28px;border-radius:24px;background:linear-gradient(150deg,#F2222B,#9E0012);color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 36px rgba(227,18,27,.3)">
      <div class="pt-calc-packhd" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px">
        <span class="pt-calc-lbl" style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Khách có Gói Cứu hộ 24/7</span>
        <a class="pt-calc-reg" href="#dang-ky-goi" style="background:#fff;color:#C40016;font-size:13px;font-weight:700;padding:13px 16px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;border-radius:100px;text-decoration:none">Đăng ký gói</a>
      </div>
      <div class="pt-calc-packt" style="font-family:'Inter Tight',sans-serif;font-size:52px;line-height:1;font-weight:700;letter-spacing:-.03em">{{packText}}</div>
      <div class="pt-calc-note" style="display:inline-flex;align-self:flex-start;background:rgba(255,255,255,.16);border-radius:100px;padding:8px 14px;font-size:14px;font-weight:600">{{packNote}}</div>
    </div>

    <div class="pt-calc-pay" style="padding:24px 28px;border-radius:24px;border:1.5px solid #E6E6E6;display:flex;flex-direction:column;gap:8px">
      <span class="pt-calc-lbl" style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#555">Chưa có gói · cứu kéo theo chuyến</span>
      <div class="pt-calc-payt" style="font-family:'Inter Tight',sans-serif;font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.02em">{{payText}}</div>
      <div class="pt-calc-bd" style="font-size:14px;color:#555">{{payBreakdown}}</div>
    </div>



  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { km: 15, pos: null, status: 'idle', picked: null, mode: 'manual' };
  }

  dealersData() {
    // 10 đại lý ôtô Phát Tiến; toạ độ ước tính theo địa chỉ.
    return [
      { id: 'c0', name: 'Honda Ôtô Sài Gòn – Quận 2', area: '136D Mai Chí Thọ, P. Bình Trưng, TP.HCM', lat: 10.788, lng: 106.74 },
      { id: 'c1', name: 'Honda Ôtô Đồng Nai – Biên Hoà', area: 'B04 KP3, Khu thương mại Amata, P. Long Bình, Đồng Nai', lat: 10.948, lng: 106.871 },
      { id: 'c2', name: 'Honda Ôtô Long An – Tân An', area: '86 Quốc lộ 1 (tuyến tránh), P. Long An, Tây Ninh', lat: 10.544, lng: 106.402 },
      { id: 'c3', name: 'Honda Ôtô Tây Ninh – Hoà Thành', area: 'KP Hiệp Hoà, P. Thanh Điền, Tây Ninh', lat: 11.286, lng: 106.13 },
      { id: 'c5', name: 'Toyota Ninh Kiều', area: '57 (59A) Cách Mạng Tháng Tám, P. Cái Khế, TP. Cần Thơ', lat: 10.048, lng: 105.778 },
      { id: 'c6', name: 'Toyota Tiền Giang', area: 'Ấp Long Tường, X. Châu Thành, Đồng Tháp', lat: 10.35, lng: 106.3 },
      { id: 'c7', name: 'Toyota Bến Tre', area: '186A, KP Phước Thạnh, P. Sơn Đông, Vĩnh Long', lat: 10.256, lng: 106.35 },
      { id: 'c8', name: 'Toyota An Sương', area: '382 Lê Quang Đạo, P. Trung Mỹ Tây, TP.HCM', lat: 10.856, lng: 106.615 },
      { id: 'c9', name: 'Toyota An Sương – CN Trường Chinh', area: '113 Trường Chinh, P. Đông Hưng Thuận, TP.HCM', lat: 10.829, lng: 106.623 },
      { id: 'c10', name: 'Mitsubishi Vĩnh Long', area: 'Tổ 10, Ấp Tân Hưng, X. Tân Hạnh, Vĩnh Long', lat: 10.23, lng: 105.935 }
    ];
  }

  distanceKm(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  locate() {
    if (!navigator.geolocation) { this.setState({ status: 'unsupported' }); return; }
    this.setState({ status: 'loading' });
    try {
      navigator.geolocation.getCurrentPosition(
        (p) => this.setState({ pos: { lat: p.coords.latitude, lng: p.coords.longitude }, status: 'ok', mode: 'gps' }),
        () => this.setState({ status: 'denied' }),
        { timeout: 10000, maximumAge: 60000 }
      );
    } catch (e) { this.setState({ status: 'denied' }); }
  }

  money(v) {
    return v.toLocaleString('vi-VN') + ' VNĐ';
  }

  renderVals() {
    const { pos, status, mode } = this.state;
    let list = this.dealersData().map((d) => ({ ...d, dist: pos ? this.distanceKm(pos, d) : null }));
    if (pos) list.sort((a, b) => a.dist - b.dist);
    const pickedId = this.state.picked || (pos ? list[0].id : null);
    const picked = list.find((d) => d.id === pickedId) || null;

    const useGps = mode === 'gps' && picked && picked.dist != null;
    const km = useGps ? Math.ceil(picked.dist) : Math.max(0, Math.round(this.state.km || 0));
    const over = Math.max(0, km - 10);
    const pay = 600000 + 25000 * over;
    // Gói Cứu hộ 24/7: miễn phí cứu kéo trong 100 km, phần vượt 25.000 VNĐ/km.
    const packOver = Math.max(0, km - 100);
    const packPay = 25000 * packOver;

    const statusMap = {
      idle: 'Cho phép truy cập vị trí để tìm đại lý gần nhất, hoặc nhập số km bên dưới.',
      loading: 'Đang lấy vị trí của bạn…',
      ok: 'Đã lấy vị trí. Danh sách đại lý đã xếp từ gần đến xa.',
      denied: 'Không lấy được vị trí (bị chặn hoặc hết thời gian). Hãy nhập số km bên dưới.',
      unsupported: 'Trình duyệt không hỗ trợ định vị. Hãy nhập số km bên dưới.'
    };

    return {
      locate: () => this.locate(),
      locateLabel: status === 'loading' ? 'Đang định vị…' : (pos ? 'Cập nhật vị trí' : 'Dùng vị trí hiện tại của tôi'),
      statusText: picked && !pos && (status === 'denied' || status === 'unsupported')
        ? 'Không lấy được vị trí để đo tới ' + picked.name + '. Hãy nhập số km từ chỗ bạn tới đại lý ở ô bên dưới.'
        : statusMap[status],
      statusCls: status === 'idle' ? 'pt-calc-idle' : '',
      statusColor: status === 'denied' || status === 'unsupported' ? '#C40016' : '#555555',
      kmValue: km,
      onKm: (e) => this.setState({ km: Math.max(0, Number(e.target.value) || 0), mode: 'manual' }),
      dealers: list.map((d) => ({
        id: d.id,
        label: d.name + (d.dist != null ? ' · ~' + d.dist.toFixed(1) + ' km' : '')
      })),
      pickedValue: pickedId || '',
      pickedAddr: picked ? picked.area : 'Chọn đại lý để xem địa chỉ. Dùng vị trí hiện tại để xếp đại lý từ gần đến xa.',
      onPick: (e) => {
        const id = e.target.value || null;
        this.setState({ picked: id, mode: pos ? 'gps' : 'manual' });
        // Chưa có vị trí thì lấy luôn để đo km tới đại lý vừa chọn
        if (id && !pos && status !== 'loading') this.locate();
      },
      routeLabel: useGps ? 'Từ vị trí của bạn tới ' + picked.name
        : picked ? (status === 'loading' ? 'Đang đo khoảng cách tới ' + picked.name + '…' : 'Tới ' + picked.name + ' (nhập tay)')
        : 'Khoảng cách cứu kéo (nhập tay)',
      kmText: km + ' km',
      step3Title: km > 100 ? 'Chi phí ước tính' : 'Chi phí ước tính nếu không có gói Cứu hộ 24/7',
      payText: this.money(pay),
      packText: packPay === 0 ? 'Miễn phí' : this.money(packPay),
      packNote: packOver > 0
        ? 'Miễn phí 100 km đầu · 25.000 × ' + packOver + ' km vượt'
        : 'Trong bán kính 100 km: miễn phí cứu kéo',
      payBreakdown: over > 0
        ? '600.000 + 25.000 × ' + over + ' km vượt'
        : 'Trong phạm vi 10 km: 600.000 VNĐ/chuyến'
    };
  }
}
</script>
</body>
</html>
