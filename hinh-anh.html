[tn, 'Xe va chạm – kéo lên sàn trượt về xưởng', '/_blob/658a48d06c7885c3bba177a2e51d74ac', 'Kéo xe hư hỏng phần đầu lên sàn trượt'],\n      [keo, 'Chở xe gặp sự cố về đại lý', '/_blob/121705c7c0634feb2c6cdf0b3d7b8a8f', 'Xe cứu hộ Phát Tiến chở xe về đại lý'],\n      [tn, 'Tiếp nhận xe va chạm tại hiện trường', '/_blob/cee4db4624420964de68310db17fcbe3', 'Kỹ thuật viên kiểm tra xe va chạm phía sau'],\n      [tai, 'Xe SUV xẹp lốp – thay lốp tại chỗ', '/_blob/e1e0c74642e72bd5b41422b0372bf247', 'Kỹ thuật viên kích xe SUV để thay lốp'],\n      [tai, 'Thay lốp ban đêm, đặt biển cảnh báo', '/_blob/b20a434669f463666f2a5849b1756002', 'Thay lốp ban đêm với biển cảnh báo tam giác'],\n      [tai, 'Tư vấn và kiểm tra xe cho khách', '/_blob/32afcaa3f5fe16b908260f96c014d55f', 'Kỹ thuật viên trao đổi với khách bên xe mở nắp capo'],\n      [tai, 'Kiểm tra khoang máy tại hiện trường', '/_blob/c87fbf860d9258728c8f7f8b3bde43e4', 'Kỹ thuật viên kiểm tra khoang máy cùng khách hàng'],\n      [keo, 'Cứu kéo xe về đại lý bằng sàn trượt', '/_blob/9d5589425c7d56123ca2fc6ff769ff37', 'Xe cứu kéo sàn trượt Phát Tiến chở ô tô']\n    ].map(([cat, title, img, alt], i) => ({ cat, title, img, alt, no: String(i + 1).padStart(2, '0') }));\n  }\n\n  submitForm() {\n    const val = (id) => {\n      const el = document.getElementById(id);\n      return el ? el.value.trim() : '';\n    };\n    const name = val('dk-name');\n    const phone = val('dk-phone');\n    if (!name || !phone) {\n      this.setState({ error: 'Vui lòng nhập họ tên và số điện thoại.' });\n      return;\n    }\n    if (!/^0\\d{9,10}$/.test(phone.replace(/[\\s.\\-]/g, ''))) {\n      this.setState({ error: 'Số điện thoại chưa đúng, vui lòng kiểm tra lại.' });\n      return;\n    }\n    this.setState({ sent: { name, phone }, error: '' });\n  }\n\n  renderVals() {\n    const cats = ['Tất cả', 'Cứu kéo', 'Ứng cứu tại chỗ', 'Tai nạn'];\n    const { cat } = this.state;\n    const list = this.cases().filter((c) => cat === 'all' || c.cat === cat);\n    const perPage = 6; // số ca mỗi trang; thêm ca mới thì số trang tự tăng\n    const total = Math.max(1, Math.ceil(list.length / perPage));\n    const page = Math.min(this.state.page || 1, total);\n    const show = {};\n    this.cases().forEach((c) => { show['c' + c.no] = false; });\n    list.forEach((c, i) => { show['c' + c.no] = i >= (page - 1) * perPage && i \u003c page * perPage; });\n    const go = (p) => () => {\n      if (p \u003c 1 || p > total || p === page) return;\n      this.setState({ page: p });\n      const el = typeof document !== 'undefined' && document.getElementById('thu-vien');\n      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    };\n    const { sent, error } = this.state;\n    return {\n      formOpen: !sent,\n      formSent: !!sent,\n      formError: error,\n      sentName: sent ? sent.name : '',\n      sentPhone: sent ? sent.phone : '',\n      submitForm: () => this.submitForm(),\n      resetForm: () => this.setState({ sent: null, error: '' }),\n      packagePerks: [\n        'Một đầu mối hỗ trợ 24/7 qua Hotline 0901.117.111',\n        'Cứu kéo miễn phí trong bán kính 100 km (vượt 100 km: 25.000 VNĐ/km)',\n        'Cố vấn Dịch vụ hướng dẫn xử lý ban đầu và thủ tục liên hệ bảo hiểm',\n        'Xe được đưa về Đại lý chính hãng hoặc điểm dịch vụ phù hợp'\n      ],\n      filters: cats.map((label) => {\n        const id = label === 'Tất cả' ? 'all' : label;\n        const on = id === cat;\n        return { label, border: on ? '#E3121B' : '#E0E0E0', bg: on ? '#E3121B' : '#fff', fg: on ? '#fff' : '#000', pick: () => this.setState({ cat: id, page: 1 }) };\n      }),\n      show,\n      hasPages: total > 1,\n      pages: Array.from({ length: total }, (_, i) => {\n        const n = i + 1, on = n === page;\n        return { n: String(n), aria: 'Trang ' + n, border: on ? '#E3121B' : '#E0E0E0', bg: on ? '#E3121B' : '#fff', fg: on ? '#fff' : '#000', go: go(n) };\n      }),\n      prevPage: go(page - 1),\n      nextPage: go(page + 1),\n      prevColor: page > 1 ? '#000' : '#C8C8C8',\n      nextColor: page \u003c total ? '#000' : '#C8C8C8',\n      pageInfo: 'Trang ' + page + '/' + total + ' · ' + list.length + ' ca cứu hộ',\n      timeline: [\n        { time: '13h00 · Tiếp nhận', title: 'Khách gọi hotline, CVDV xác nhận vị trí và tình trạng xe' },\n        { time: '13h30 · Có mặt', title: 'Xe cứu hộ tới hiện trường sau 30 phút' },\n        { time: '13h50 · Cứu kéo', title: 'Xe được chở về đại lý để kiểm tra, sửa chữa' },\n        { time: '16h30 · Bàn giao', title: 'Xe được bàn giao cho khách' }\n      ]\n    };\n  }\n}\n","props":{}},"PTKmCalc":{"tpl":"\n\u003chelmet>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width:100%;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;color:#000;background:#fff;border:1.5px solid #F7B4B7;border-radius:32px;padding:clamp(18px,3vw,32px);box-shadow:0 16px 50px rgba(227,18,27,.1);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start\">\n\n  \u003c!-- INPUTS -->\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:24px\">\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n      \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">1\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Vị trí của bạn\u003c/span>\u003c/div>\n      \u003cbutton type=\"button\" onClick=\"{{locate}}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border:0;border-radius:100px;background:#111;color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer\">\n        \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\">\u003c/circle>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3\">\u003c/path>\u003ccircle cx=\"12\" cy=\"12\" r=\"7\">\u003c/circle>\u003c/svg>\n        \u003cspan>{{locateLabel}}\u003c/span>\n      \u003c/button>\n      \u003cdiv style=\"font-size:13px;line-height:1.5;color:{{statusColor}}\">{{statusText}}\u003c/div>\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#F6F6F6;border-radius:20px\">\n        \u003clabel for=\"pt-km\" style=\"font-size:14px;font-weight:600\">Hoặc nhập khoảng cách (km)\u003c/label>\n        \u003cdiv style=\"display:flex;gap:14px;align-items:center\">\n          \u003cinput id=\"pt-km\" type=\"number\" min=\"0\" max=\"500\" value=\"{{kmValue}}\" onChange=\"{{onKm}}\" style=\"width:96px;height:46px;box-sizing:border-box;padding:0 14px;border:1.5px solid #DADADA;border-radius:100px;font-family:'Inter',sans-serif;font-size:16px;font-weight:700\">\n          \u003cinput type=\"range\" min=\"0\" max=\"200\" value=\"{{kmValue}}\" onChange=\"{{onKm}}\" aria-label=\"Kéo để chọn số km\" style=\"flex-grow:1;accent-color:#E3121B\">\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n      \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">2\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Chọn đại lý nhận xe\u003c/span>\u003c/div>\n      \u003clabel for=\"pt-dealer\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">Đại lý nhận xe\u003c/label>\n      \u003cselect id=\"pt-dealer\" value=\"{{pickedValue}}\" onChange=\"{{onPick}}\" style=\"height:56px;box-sizing:border-box;padding:0 20px;border:1.5px solid #E3121B;border-radius:100px;background:#fff;font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:#000;cursor:pointer\">\n        \u003coption value=\"\">Chọn đại lý nhận xe…\u003c/option>\n        \u003csc-for list=\"{{dealers}}\" as=\"d\" hint-placeholder-count=\"10\">\u003coption value=\"{{d.id}}\">{{d.label}}\u003c/option>\u003c/sc-for>\n      \u003c/select>\n      \u003cdiv style=\"display:flex;gap:10px;align-items:flex-start;padding:14px 18px;background:#F6F6F6;border-radius:20px;font-size:13px;line-height:1.5;color:#555\">\n        \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E3121B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex:none;margin-top:1px\">\u003cpath d=\"M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z\">\u003c/path>\u003ccircle cx=\"12\" cy=\"9\" r=\"2.5\">\u003c/circle>\u003c/svg>\n        \u003cspan>{{pickedAddr}}\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"font-size:12px;line-height:1.5;color:#757575\">* 10 đại lý ôtô chính hãng của Phát Tiến. Khoảng cách tính theo đường chim bay, mang tính tham khảo.\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- RESULTS -->\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">3\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Chi phí ước tính\u003c/span>\u003c/div>\n\n    \u003cdiv style=\"padding:22px 24px;background:#F6F6F6;border-radius:24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 12px\">\n      \u003cspan style=\"font-size:14px;color:#555\">{{routeLabel}}\u003c/span>\n      \u003cspan style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,#9E0012,#F2222B);-webkit-background-clip:text;background-clip:text;color:transparent\">{{kmText}}\u003c/span>\n    \u003c/div>\n\n    \u003cdiv style=\"padding:26px 28px;border-radius:24px;background:linear-gradient(150deg,#F2222B,#9E0012);color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 36px rgba(227,18,27,.3)\">\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px\">\n        \u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85\">Khách có Gói Cứu hộ 24/7\u003c/span>\n        \u003ca href=\"PTCuuHo.dc.html#dang-ky-goi\" style=\"background:#fff;color:#C40016;font-size:13px;font-weight:700;padding:13px 16px;border-radius:100px;text-decoration:none\">Đăng ký gói\u003c/a>\n      \u003c/div>\n      \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-size:52px;line-height:1;font-weight:700;letter-spacing:-.03em\">{{packText}}\u003c/div>\n      \u003cdiv style=\"display:inline-flex;align-self:flex-start;background:rgba(255,255,255,.16);border-radius:100px;padding:8px 14px;font-size:14px;font-weight:600\">{{packNote}}\u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"padding:24px 28px;border-radius:24px;border:1.5px solid #E6E6E6;display:flex;flex-direction:column;gap:8px\">\n      \u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#555\">Chưa có gói · cứu kéo theo chuyến\u003c/span>\n      \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.02em\">{{payText}}\u003c/div>\n      \u003cdiv style=\"font-size:14px;color:#555\">{{payBreakdown}}\u003c/div>\n    \u003c/div>\n\n    \u003ca href=\"tel:0901117111\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;background:#111;color:#fff;border-radius:100px;text-decoration:none;font-weight:600;font-size:16px\">\n      \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\">\u003c/path>\u003c/svg>\n      Cần cứu hộ ngay? Gọi 0901.117.111\n    \u003c/a>\n    \u003cdiv style=\"font-size:12px;line-height:1.5;color:#757575;text-align:center\">Chi phí cuối cùng do chuyên viên dịch vụ xác nhận khi tiếp nhận.\u003c/div>\n  \u003c/div>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { km: 15, pos: null, status: 'idle', picked: null, mode: 'manual' };\n  }\n\n  dealersData() {\n    // 10 đại lý ôtô Phát Tiến; toạ độ ước tính theo địa chỉ.\n    return [\n      { id: 'c0', name: 'Honda Ôtô Sài Gòn – Quận 2', area: '136D Mai Chí Thọ, P. Bình Trưng, TP.HCM', lat: 10.788, lng: 106.74 },\n      { id: 'c1', name: 'Honda Ôtô Đồng Nai – Biên Hoà', area: 'B04 KP3, Khu thương mại Amata, P. Long Bình, Đồng Nai', lat: 10.948, lng: 106.871 },\n      { id: 'c2', name: 'Honda Ôtô Long An – Tân An', area: '86 Quốc lộ 1 (tuyến tránh), P. Long An, Tây Ninh', lat: 10.544, lng: 106.402 },\n      { id: 'c3', name: 'Honda Ôtô Tây Ninh – Hoà Thành', area: 'KP Hiệp Hoà, P. Thanh Điền, Tây Ninh', lat: 11.286, lng: 106.13 },\n      { id: 'c5', name: 'Toyota Ninh Kiều', area: '57 (59A) Cách Mạng Tháng Tám, P. Cái Khế, TP. Cần Thơ', lat: 10.048, lng: 105.778 },\n      { id: 'c6', name: 'Toyota Tiền Giang', area: 'Ấp Long Tường, X. Châu Thành, Đồng Tháp', lat: 10.35, lng: 106.3 },\n      { id: 'c7', name: 'Toyota Bến Tre', area: '186A, KP Phước Thạnh, P. Sơn Đông, Vĩnh Long', lat: 10.256, lng: 106.35 },\n      { id: 'c8', name: 'Toyota An Sương', area: '382 Lê Quang Đạo, P. Trung Mỹ Tây, TP.HCM', lat: 10.856, lng: 106.615 },\n      { id: 'c9', name: 'Toyota An Sương – CN Trường Chinh', area: '113 Trường Chinh, P. Đông Hưng Thuận, TP.HCM', lat: 10.829, lng: 106.623 },\n      { id: 'c10', name: 'Mitsubishi Vĩnh Long', area: 'Tổ 10, Ấp Tân Hưng, X. Tân Hạnh, Vĩnh Long', lat: 10.23, lng: 105.935 }\n    ];\n  }\n\n  distanceKm(a, b) {\n    const R = 6371, rad = Math.PI / 180;\n    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;\n    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;\n    return 2 * R * Math.asin(Math.sqrt(h));\n  }\n\n  money(v) {\n    return v.toLocaleString('vi-VN') + ' VNĐ';\n  }\n\n  renderVals() {\n    const { pos, status, mode } = this.state;\n    let list = this.dealersData().map((d) => ({ ...d, dist: pos ? this.distanceKm(pos, d) : null }));\n    if (pos) list.sort((a, b) => a.dist - b.dist);\n    const pickedId = this.state.picked || (pos ? list[0].id : null);\n    const picked = list.find((d) => d.id === pickedId) || null;\n\n    const useGps = mode === 'gps' && picked && picked.dist != null;\n    const km = useGps ? Math.ceil(picked.dist) : Math.max(0, Math.round(this.state.km || 0));\n    const over = Math.max(0, km - 10);\n    const pay = 600000 + 25000 * over;\n    // Gói Cứu hộ 24/7: miễn phí cứu kéo trong 100 km, phần vượt 25.000 VNĐ/km.\n    const packOver = Math.max(0, km - 100);\n    const packPay = 25000 * packOver;\n\n    const statusMap = {\n      idle: 'Cho phép truy cập vị trí để tìm đại lý gần nhất, hoặc nhập số km bên dưới.',\n      loading: 'Đang lấy vị trí của bạn…',\n      ok: 'Đã lấy vị trí. Danh sách đại lý đã xếp từ gần đến xa.',\n      denied: 'Không lấy được vị trí (bị chặn hoặc hết thời gian). Hãy nhập số km bên dưới.',\n      unsupported: 'Trình duyệt không hỗ trợ định vị. Hãy nhập số km bên dưới.'\n    };\n\n    return {\n      locate: () => {\n        if (!navigator.geolocation) { this.setState({ status: 'unsupported' }); return; }\n        this.setState({ status: 'loading' });\n        try {\n          navigator.geolocation.getCurrentPosition(\n            (p) => this.setState({ pos: { lat: p.coords.latitude, lng: p.coords.longitude }, status: 'ok', mode: 'gps', picked: null }),\n            () => this.setState({ status: 'denied' }),\n            { timeout: 10000, maximumAge: 60000 }\n          );\n        } catch (e) { this.setState({ status: 'denied' }); }\n      },\n      locateLabel: status === 'loading' ? 'Đang định vị…' : (pos ? 'Cập nhật vị trí' : 'Dùng vị trí hiện tại của tôi'),\n      statusText: statusMap[status],\n      statusColor: status === 'denied' || status === 'unsupported' ? '#C40016' : '#555555',\n      kmValue: km,\n      onKm: (e) => this.setState({ km: Math.max(0, Number(e.target.value) || 0), mode: 'manual' }),\n      dealers: list.map((d) => ({\n        id: d.id,\n        label: d.name + (d.dist != null ? ' · ~' + d.dist.toFixed(1) + ' km' : '')\n      })),\n      pickedValue: pickedId || '',\n      pickedAddr: picked ? picked.area : 'Chọn đại lý để xem địa chỉ. Dùng vị trí hiện tại để xếp đại lý từ gần đến xa.',\n      onPick: (e) => this.setState({ picked: e.target.value || null, mode: pos ? 'gps' : 'manual' }),\n      routeLabel: useGps ? 'Từ vị trí của bạn tới ' + picked.name : 'Khoảng cách cứu kéo (nhập tay)',\n      kmText: km + ' km',\n      payText: this.money(pay),\n      packText: packPay === 0 ? 'Miễn phí' : this.money(packPay),\n      packNote: packOver > 0\n        ? 'Miễn phí 100 km đầu · 25.000 × ' + packOver + ' km vượt'\n        : 'Trong bán kính 100 km: miễn phí cứu kéo',\n      payBreakdown: over > 0\n        ? '600.000 + 25.000 × ' + over + ' km vượt'\n        : 'Trong phạm vi 10 km: 600.000 VNĐ/chuyến'\n    };\n  }\n}\n","props":{}},"PTDealerFinder":{"tpl":"\n\u003chelmet>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width:100%;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;color:#000;background:#fff;border:1.5px solid #F7B4B7;border-radius:32px;padding:clamp(18px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start\">\n\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:18px\">\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">1\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Vị trí của bạn\u003c/span>\u003c/div>\n    \u003cbutton type=\"button\" onClick=\"{{locate}}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border:0;border-radius:100px;background:#111;color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer\">\n      \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\">\u003c/circle>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 y {\n          navigator.geolocation.getCurrentPosition(\n            (p) => this.setState({ pos: { lat: p.coords.latitude, lng: p.coords.longitude }, status: 'ok', area: '' }),\n            () => this.setState({ status: 'denied' }),\n            { timeout: 10000, maximumAge: 60000 }\n          );\n        } catch (e) { this.setState({ status: 'denied' }); }\n      },\n      locateLabel: status === 'loading' ? 'Đang định vị…' : (status === 'ok' ? 'Cập nhật vị trí' : 'Dùng vị trí hiện tại của tôi'),\n      statusText: statusMap[status],\n      statusColor: status === 'denied' || status === 'unsupported' ? '#C40016' : '#555555',\n      areaValue: area,\n      onArea: (e) => {\n        const a = this.areas().find((x) => x.id === e.target.value);\n        if (a) this.setState({ pos: { lat: a.lat, lng: a.lng }, status: 'area', area: a.id });\n        else this.setState({ pos: null, status: 'idle', area: '' });\n      },\n      brands: this.brandList().map((b) => {\n        const on = b.id === brand;\n        return { label: b.label, border: on ? '#E3121B' : '#E6E6E6', bg: on ? '#E3121B' : '#FFFFFF', color: on ? '#FFFFFF' : '#000000', pick: () => this.setState({ brand: b.id }) };\n      }),\n      nearestName: nearest ? nearest.name : 'Chưa có vị trí',\n      nearestDist: nearest ? '~' + nearest.dist.toFixed(1) + ' km' : '— km',\n      listTitle: pos ? 'Đại lý gần bạn nhất' : 'Danh sách đại lý',\n      listCount: 'Hiển thị ' + shown.length + '/' + list.length,\n      results: shown.map((d, i) => {\n        const top = pos && i === 0;\n        return {\n          rank: pos ? String(i + 1) : '•',\n          rankBg: top ? '#E3121B' : '#F4F4F4',\n          rankColor: top ? '#FFFFFF' : '#000000',\n          border: top ? '#E3121B' : '#EEEEEE',\n          bg: top ? '#FFF1F2' : '#FFFFFF',\n          group: d.group.toUpperCase(),\n          name: d.name,\n          addr: d.addr,\n          dist: d.dist != null ? '~' + d.dist.toFixed(1) + ' km' : '—',\n          mapUrl: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(d.name + ', ' + d.addr)\n        };\n      })\n    };\n  }\n}\n","props":{}}};</script>
