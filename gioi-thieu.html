er;gap:28px 88px;margin-top:44px\">\n      \u003csc-for list=\"{{heroStats}}\" as=\"h\" hint-placeholder-count=\"3\">\n        \u003cdiv style=\"max-width:220px\">\n          \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:44px;line-height:1;background:linear-gradient(90deg,#F2222B,#9E0012);-webkit-background-clip:text;background-clip:text;color:transparent\">{{h.big}}\u003c/div>\n          \u003cdiv style=\"font-size:14px;color:#555;margin-top:8px;line-height:1.5\">{{h.desc}}\u003c/div>\n        \u003c/div>\n      \u003c/sc-for>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- CHÚNG TÔI LÀ AI -->\n  \u003cdiv style=\"max-width:1240px;margin:0 auto;padding:88px 24px;box-sizing:border-box\">\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:center\">\n      \u003cdiv style=\"flex:1 1 440px;min-width:0;height:460px;border-radius:230px 28px 28px 230px;border:2px solid #E3121B;padding:10px;box-sizing:border-box\">\n        \u003cdiv style=\"height:100%;border-radius:220px 20px 20px 220px;overflow:hidden\">\n          \u003cimg src=\"/_blob/0f39a768c805b15ab9d322787136accf\" alt=\"Lễ khai trương đại lý Honda Ôtô của Phát Tiến\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"flex:1 1 440px;min-width:0\">\n        \u003cdiv style=\"font-size:14px;font-weight:600;color:#E3121B;text-transform:uppercase;letter-spacing:.06em\">Chúng tôi là ai\u003c/div>\n        \u003ch2 style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:clamp(32px,4vw,48px);line-height:1.1;letter-spacing:-.02em;margin:10px 0 16px\">Gần 30 năm phụng sự \u003cspan style=\"color:#E3121B\">khách hàng Việt\u003c/span>\u003c/h2>\n        \u003cp style=\"font-size:16px;line-height:1.7;color:#333;margin:0 0 18px\">Thành lập từ năm 1995, Phát Tiến hiện sở hữu chuỗi cửa hàng cung cấp trọn vẹn chuỗi sản phẩm và dịch vụ trong hệ sinh thái Ôtô — Môtô — Xe máy tại Việt Nam:\u003c/p>\n        \u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n          \u003csc-for list=\"{{network}}\" as=\"n\" hint-placeholder-count=\"6\">\n            \u003cdiv style=\"display:flex;gap:12px;font-size:15px;line-height:1.55;color:#333\">\u003cspan style=\"width:8px;height:8px;border-radius:50%;background:#E3121B;margin-top:8px;flex:none\">\u003c/span>{{n}}\u003c/div>\n          \u003c/sc-for>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- TRIẾT LÝ (red band) -->\n  \u003cdiv style=\"background:linear-gradient(160deg,#F2222B 0%,#C40016 55%,#8A0010 100%);color:#fff;padding:80px 0\">\n    \u003cdiv style=\"max-width:1240px;margin:0 auto;padding:0 24px;box-sizing:border-box\">\n      \u003cdiv style=\"text-align:center;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8\">Triết lý kinh doanh\u003c/div>\n      \u003ch2 style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,44px);line-height:1.2;letter-spacing:-.02em;text-align:center;margin:12px auto 44px;max-width:860px\">Mang lại cho khách hàng niềm vui thông qua những giải pháp di chuyển\u003c/h2>\n      \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n        \u003cdiv style=\"border-radius:28px;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.55);box-shadow:0 0 40px rgba(255,140,140,.35);display:flex;flex-direction:column\">\n          \u003cdiv style=\"height:180px;border-radius:22px;overflow:hidden\">\u003cimg src=\"/_blob/0dec84cdeae2232737f28005053190ff\" alt=\"Khu tiếp đón khách hàng tại đại lý Biên Hoà\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\u003c/div>\n          \u003cdiv style=\"padding:20px 14px 14px\">\n            \u003cdiv style=\"display:flex;align-items:baseline;gap:10px\">\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:32px;line-height:1\">01\u003c/span>\u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.1em;opacity:.8\">ĐỐI VỚI\u003c/span>\u003c/div>\n            \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:24px;margin:6px 0 10px\">Khách hàng\u003c/div>\n            \u003cdiv style=\"font-size:14px;line-height:1.6;opacity:.92\">Lấy khách hàng làm trung tâm trong mọi hoạt động; quy trình, trải nghiệm và chất lượng dịch vụ được chăm chút với sự nghiêm túc và tận tâm cao nhất.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"border-radius:28px;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.55);box-shadow:0 0 40px rgba(255,140,140,.35);display:flex;flex-direction:column\">\n          \u003cdiv style=\"height:180px;border-radius:22px;overflow:hidden\">\u003cimg src=\"/_blob/072465c5bbf090813072115427f38d4f\" alt=\"Không gian làm việc của nhân viên Phát Tiến\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\u003c/div>\n          \u003cdiv style=\"padding:20px 14px 14px\">\n            \u003cdiv style=\"display:flex;align-items:baseline;gap:10px\">\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:32px;line-height:1\">02\u003c/span>\u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.1em;opacity:.8\">ĐỐI VỚI\u003c/span>\u003c/div>\n            \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:24px;margin:6px 0 10px\">Nhân viên\u003c/div>\n            \u003cdiv style=\"font-size:14px;line-height:1.6;opacity:.92\">Xây dựng môi trường làm việc năng động, sáng tạo, nhân văn và bình đẳng — nơi mọi thành viên được làm việc và phát huy trọn vẹn năng lực của mình.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"border-radius:28px;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.55);box-shadow:0 0 40px rgba(255,140,140,.35);display:flex;flex-direction:column\">\n          \u003cdiv style=\"height:180px;border-radius:22px;overflow:hidden\">\u003cimg src=\"/_blob/fa7a746bcff68cd49f0b09236a40e8f0\" alt=\"Lễ khai trương cùng đối tác\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\u003c/div>\n          \u003cdiv style=\"padding:20px 14px 14px\">\n            \u003cdiv style=\"display:flex;align-items:baseline;gap:10px\">\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:32px;line-height:1\">03\u003c/span>\u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.1em;opacity:.8\">ĐỐI VỚI\u003c/span>\u003c/div>\n            \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:24px;margin:6px 0 10px\">Đối tác\u003c/div>\n            \u003cdiv style=\"font-size:14px;line-height:1.6;opacity:.92\">Luôn xây dựng và giữ gìn mối quan hệ hợp tác trên tinh thần tin cậy, tôn trọng và hợp tác đôi bên cùng có lợi, bền vững dài lâu.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"border-radius:28px;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.55);box-shadow:0 0 40px rgba(255,140,140,.35);display:flex;flex-direction:column\">\n          \u003cdiv style=\"height:180px;border-radius:22px;overflow:hidden\">\u003cimg src=\"/_blob/ab5c82096c6a062987ac5f4829d9ae87\" alt=\"Khánh thành Cầu Trí Đức 8\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\u003c/div>\n          \u003cdiv style=\"padding:20px 14px 14px\">\n            \u003cdiv style=\"display:flex;align-items:baseline;gap:10px\">\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:32px;line-height:1\">04\u003c/span>\u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.1em;opacity:.8\">ĐỐI VỚI\u003c/span>\u003c/div>\n            \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:24px;margin:6px 0 10px\">Cộng đồng\u003c/div>\n            \u003cdiv style=\"font-size:14px;line-height:1.6;opacity:.92\">Hài hoà lợi ích giữa doanh nghiệp và xã hội; chung tay xây dựng cộng đồng thông qua các hoạt động thiện nguyện cùng Quỹ Từ Thiện Xã Hội Trí Đức.\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- TẦM NHÌN -->\n  \u003cdiv style=\"max-width:1240px;margin:0 auto;padding:88px 24px 0;box-sizing:border-box\">\n    \u003cdiv style=\"border-radius:32px;overflow:hidden;background:linear-gradient(120deg,#E3121B 0%,#9E0012 55%,#1A1A1A 100%);color:#fff;display:flex;flex-wrap:wrap;box-shadow:0 20px 50px rgba(227,18,27,.25)\">\n      \u003cdiv style=\"flex:1 1 420px;min-width:0;padding:clamp(28px,4vw,56px);display:flex;flex-direction:column;justify-content:center;gap:16px\">\n        \u003cdiv style=\"font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8\">Tầm nhìn\u003c/div>\n        \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:clamp(26px,3vw,36px);line-height:1.25;letter-spacing:-.01em\">Trở thành doanh nghiệp hàng đầu trong lĩnh vực Ôtô - Môtô&nbsp; - Xe máy, đạt vị thế cạnh tranh bền vững và mang lại giá trị thiết thực cho khách hàng và xã hội.\u003c/div>\n        \u003cdiv style=\"font-size:15px;line-height:1.7;opacity:.9\">Không chỉ quan tâm doanh thu, chúng tôi không ngừng đổi mới và phát triển để đạt được vị thế cạnh tranh bền vững.\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"flex:1 1 420px;min-width:0;min-height:320px\">\n        \u003cimg src=\"/_blob/7f1365746b539118fcd939174d437054\" alt=\"Lễ khai trương đại lý Mitsubishi Motors\" style=\"width: 100%; height: 100%; object-fit: cover; display: block; object-position: 44.0491% 54.3215%; object-view-box: inset(28.9442% 34.4135% 24.339% 27.0931%)\">\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- SỨ MỆNH -->\n  \u003cdiv style=\"max-width:1240px;margin:0 auto;padding:88px 24px;box-sizing:border-box\">\n    \u003cdiv style=\"text-align:center;font-size:14px;font-weight:600;color:#E3121B;letter-spacing:.08em;text-transform:uppercase\">Sứ mệnh\u003c/div>\n    \u003ch2 style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:clamp(32px,4vw,48px);letter-spacing:-.02em;text-align:center;margin:10px 0 40px\">Ba cam kết của \u003cspan style=\"color:#E3121B\">Phát Tiến\u003c/span>\u003c/h2>\n    \u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n      \u003cdiv style=\"background:#fff;border-radius:28px;padding:10px;border:1.5px solid #F7B4B7;box-shadow:0 10px 30px rgba(227,18,27,.08)\">\n        \u003cdiv style=\"height:200px;border-radius:22px;overflow:hidden\">\u003cimg src=\"/_blob/00abe26d91eca783751c42723a7f1ded\" alt=\"Vinh danh hoạt động bán hàng và dịch vụ\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\u003c/div>\n        \u003cdiv style=\"padding:20px 16px 16px\">\n          \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:56px;line-height:1;background:linear-gradient(90deg,#9E0012,#F2222B);-webkit-background-clip:text;background-clip:text;color:transparent\">01\u003c/div>\n          \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:22px;margin:10px 0 8px\">Chất lượng dịch vụ hàng đầu\u003c/div>\n          \u003cdiv style=\"font-size:15px;line-height:1.6;color:#555\">Cung cấp cho khách hàng những trải nghiệm đẳng cấp 5 sao trong quá trình sở hữu và sử dụng sản phẩm.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"background:#fff;border-radius:28px;padding:10px;border:1.5px solid #F7B4B7;box-shadow:0 10px 30px rgba(227,18,27,.08)\">\n        \u003cdiv style=\"height:200px;border-radius:22px;overflow:hidden\">\u003cimg src=\"/_blob/8ae4870ab6965ca05bd6666d7d7ee4a1\" alt=\"Nhân viên Phát Tiến nhận vinh danh\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\u003c/div>\n        \u003cdiv style=\"padding:20px 16px 16px\">\n          \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:56px;line-height:1;background:linear-gradient(90deg,#9E0012,#F2222B);-webkit-background-clip:text;background-clip:text;color:transparent\">02\u003c/div>\n          \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:22px;margin:10px 0 8px\">Phát triển nhân sự\u003c/div>\n          \u003cdiv style=\"font-size:15px;line-height:1.6;color:#555\">Tạo dựng môi trường làm việc lý tưởng, nơi mỗi nhân viên có cơ hội phát triển sự nghiệp và thăng tiến.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"background:#fff;border-radius:28px;padding:10px;border:1.5px solid #F7B4B7;box-shadow:0 10px 30px rgba(227,18,27,.08)\">\n        \u003cdiv style=\"height:200px;border-radius:22px;overflow:hidden\">\u003cimg src=\"/_blob/9bc6e402b2a0ac0583d0528253741fc5\" alt=\"Trao tặng 570 áo ấm cho các em học sinh\" style=\"width: 100%; height: 100%; object-fit: cover; display: block; object-position: 70.3176% 93.9012%; object-view-box: inset(37.0751% 5.2708% 2.408% 12.4866%)\">\u003c/div>\n        \u003cdiv style=\"padding:20px 16px 16px\">\n          \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:56px;line-height:1;background:linear-gradient(90deg,#9E0012,#F2222B);-webkit-background-clip:text;background-clip:text;color:transparent\">03\u003c/div>\n          \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:22px;margin:10px 0 8px\">Đóng góp cộng đồng\u003c/div>\n          \u003cdiv style=\"font-size:15px;line-height:1.6;color:#555\">Mang lại giá trị thiết thực và tích cực cho cộng đồng xung quanh, thông qua các hoạt động kinh doanh và xã hội có trách nhiệm.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 5T -->\n  \u003cdiv style=\"background:#F6F6F6\">\n    \u003cdiv style=\"max-width:1240px;margin:0 auto;padding:88px 24px;box-sizing:border-box;position:relative\">\n      \u003cdiv aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;top:40px;text-align:center;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(120px,18vw,260px);line-height:1;color:#ECECEC;letter-spacing:-.04em\">5T\u003c/div>\n      \u003cdiv style=\"position:relative;text-align:center;font-size:14px;font-weight:600;color:#E3121B;letter-spacing:.08em;text-transform:uppercase\">Giá trị cốt lõi\u003c/div>\n      \u003ch2 style=\"position:relative;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:clamp(32px,4vw,48px);letter-spacing:-.02em;text-align:center;margin:10px 0 40px\">5T - Kim chỉ nam của \u003cspan style=\"color: rgb(227, 18, 27)\">người Phát Tiến\u003c/span>\u003c/h2>\n      \u003cdiv style=\"position:relative;border-radius:28px;overflow:hidden;height:clamp(200px,28vw,380px);margin-bottom:24px\">\n        \u003cimg src=\"/_blob/cc634026c169b41861fb422c839cfbee\" alt=\"Sự kiện 5T Vững Vàng của Phát Tiến\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n      \u003c/div>\n      \u003cdiv style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n        \u003csc-for list=\"{{values}}\" as=\"v\" hint-placeholder-count=\"5\">\n          \u003cdiv style=\"background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.05)\">\n            \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:15px;color:#E3121B;letter-spacing:.06em\">{{v.n}}\u003c/div>\n            \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;margin:6px 0 10px;background:linear-gradient(90deg,#9E0012,#F2222B);-webkit-background-clip:text;background-clip:text;color:transparent\">{{v.title}}\u003c/div>\n            \u003cdiv style=\"font-size:14px;line-height:1.6;color:#555\">{{v.desc}}\u003c/div>\n \"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\">\u003c/path>\u003c/svg>\n      Cần cứu hộ ngay? Gọi 0901.117.111\n    \u003c/a>\n    \u003cdiv style=\"font-size:12px;line-height:1.5;color:#757575;text-align:center\">Chi phí cuối cùng do chuyên viên dịch vụ xác nhận khi tiếp nhận.\u003c/div>\n  \u003c/div>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { km: 15, pos: null, status: 'idle', picked: null, mode: 'manual' };\n  }\n\n  dealersData() {\n    // 10 đại lý ôtô Phát Tiến; toạ độ ước tính theo địa chỉ.\n    return [\n      { id: 'c0', name: 'Honda Ôtô Sài Gòn – Quận 2', area: '136D Mai Chí Thọ, P. Bình Trưng, TP.HCM', lat: 10.788, lng: 106.74 },\n      { id: 'c1', name: 'Honda Ôtô Đồng Nai – Biên Hoà', area: 'B04 KP3, Khu thương mại Amata, P. Long Bình, Đồng Nai', lat: 10.948, lng: 106.871 },\n      { id: 'c2', name: 'Honda Ôtô Long An – Tân An', area: '86 Quốc lộ 1 (tuyến tránh), P. Long An, Tây Ninh', lat: 10.544, lng: 106.402 },\n      { id: 'c3', name: 'Honda Ôtô Tây Ninh – Hoà Thành', area: 'KP Hiệp Hoà, P. Thanh Điền, Tây Ninh', lat: 11.286, lng: 106.13 },\n      { id: 'c5', name: 'Toyota Ninh Kiều', area: '57 (59A) Cách Mạng Tháng Tám, P. Cái Khế, TP. Cần Thơ', lat: 10.048, lng: 105.778 },\n      { id: 'c6', name: 'Toyota Tiền Giang', area: 'Ấp Long Tường, X. Châu Thành, Đồng Tháp', lat: 10.35, lng: 106.3 },\n      { id: 'c7', name: 'Toyota Bến Tre', area: '186A, KP Phước Thạnh, P. Sơn Đông, Vĩnh Long', lat: 10.256, lng: 106.35 },\n      { id: 'c8', name: 'Toyota An Sương', area: '382 Lê Quang Đạo, P. Trung Mỹ Tây, TP.HCM', lat: 10.856, lng: 106.615 },\n      { id: 'c9', name: 'Toyota An Sương – CN Trường Chinh', area: '113 Trường Chinh, P. Đông Hưng Thuận, TP.HCM', lat: 10.829, lng: 106.623 },\n      { id: 'c10', name: 'Mitsubishi Vĩnh Long', area: 'Tổ 10, Ấp Tân Hưng, X. Tân Hạnh, Vĩnh Long', lat: 10.23, lng: 105.935 }\n    ];\n  }\n\n  distanceKm(a, b) {\n    const R = 6371, rad = Math.PI / 180;\n    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;\n    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;\n    return 2 * R * Math.asin(Math.sqrt(h));\n  }\n\n  money(v) {\n    return v.toLocaleString('vi-VN') + ' VNĐ';\n  }\n\n  renderVals() {\n    const { pos, status, mode } = this.state;\n    let list = this.dealersData().map((d) => ({ ...d, dist: pos ? this.distanceKm(pos, d) : null }));\n    if (pos) list.sort((a, b) => a.dist - b.dist);\n    const pickedId = this.state.picked || (pos ? list[0].id : null);\n    const picked = list.find((d) => d.id === pickedId) || null;\n\n    const useGps = mode === 'gps' && picked && picked.dist != null;\n    const km = useGps ? Math.ceil(picked.dist) : Math.max(0, Math.round(this.state.km || 0));\n    const over = Math.max(0, km - 10);\n    const pay = 600000 + 25000 * over;\n    // Gói Cứu hộ 24/7: miễn phí cứu kéo trong 100 km, phần vượt 25.000 VNĐ/km.\n    const packOver = Math.max(0, km - 100);\n    const packPay = 25000 * packOver;\n\n    const statusMap = {\n      idle: 'Cho phép truy cập vị trí để tìm đại lý gần nhất, hoặc nhập số km bên dưới.',\n      loading: 'Đang lấy vị trí của bạn…',\n      ok: 'Đã lấy vị trí. Danh sách đại lý đã xếp từ gần đến xa.',\n      denied: 'Không lấy được vị trí (bị chặn hoặc hết thời gian). Hãy nhập số km bên dưới.',\n      unsupported: 'Trình duyệt không hỗ trợ định vị. Hãy nhập số km bên dưới.'\n    };\n\n    return {\n      locate: () => {\n        if (!navigator.geolocation) { this.setState({ status: 'unsupported' }); return; }\n        this.setState({ status: 'loading' });\n        try {\n          navigator.geolocation.getCurrentPosition(\n            (p) => this.setState({ pos: { lat: p.coords.latitude, lng: p.coords.longitude }, status: 'ok', mode: 'gps', picked: null }),\n            () => this.setState({ status: 'denied' }),\n            { timeout: 10000, maximumAge: 60000 }\n          );\n        } catch (e) { this.setState({ status: 'denied' }); }\n      },\n      locateLabel: status === 'loading' ? 'Đang định vị…' : (pos ? 'Cập nhật vị trí' : 'Dùng vị trí hiện tại của tôi'),\n      statusText: statusMap[status],\n      statusColor: status === 'denied' || status === 'unsupported' ? '#C40016' : '#555555',\n      kmValue: km,\n      onKm: (e) => this.setState({ km: Math.max(0, Number(e.target.value) || 0), mode: 'manual' }),\n      dealers: list.map((d) => ({\n        id: d.id,\n        label: d.name + (d.dist != null ? ' · ~' + d.dist.toFixed(1) + ' km' : '')\n      })),\n      pickedValue: pickedId || '',\n      pickedAddr: picked ? picked.area : 'Chọn đại lý để xem địa chỉ. Dùng vị trí hiện tại để xếp đại lý từ gần đến xa.',\n      onPick: (e) => this.setState({ picked: e.target.value || null, mode: pos ? 'gps' : 'manual' }),\n      routeLabel: useGps ? 'Từ vị trí của bạn tới ' + picked.name : 'Khoảng cách cứu kéo (nhập tay)',\n      kmText: km + ' km',\n      payText: this.money(pay),\n      packText: packPay === 0 ? 'Miễn phí' : this.money(packPay),\n      packNote: packOver > 0\n        ? 'Miễn phí 100 km đầu · 25.000 × ' + packOver + ' km vượt'\n        : 'Trong bán kính 100 km: miễn phí cứu kéo',\n      payBreakdown: over > 0\n        ? '600.000 + 25.000 × ' + over + ' km vượt'\n        : 'Trong phạm vi 10 km: 600.000 VNĐ/chuyến'\n    };\n  }\n}\n","props":{}},"PTDealerFinder":{"tpl":"\n\u003chelmet>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width:100%;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;color:#000;background:#fff;border:1.5px solid #F7B4B7;border-radius:32px;padding:clamp(18px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start\">\n\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:18px\">\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">1\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Vị trí của bạn\u003c/span>\u003c/div>\n    \u003cbutton type=\"button\" onClick=\"{{locate}}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border:0;border-radius:100px;background:#111;color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer\">\n      \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\">\u003c/circle>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3\">\u003c/path>\u003ccircle cx=\"12\" cy=\"12\" r=\"7\">\u003c/circle>\u003c/svg>\n      \u003cspan>{{locateLabel}}\u003c/span>\n    \u003c/button>\n    \u003cdiv style=\"font-size:13px;line-height:1.5;color:{{statusColor}}\">{{statusText}}\u003c/div>\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#F6F6F6;border-radius:20px\">\n      \u003clabel for=\"pt-area\" style=\"font-size:14px;font-weight:600\">Hoặc chọn khu vực của bạn\u003c/label>\n      \u003cselect id=\"pt-area\" value=\"{{areaValue}}\" onChange=\"{{onArea}}\" style=\"height:48px;box-sizing:border-box;padding:0 16px;border:1.5px solid #DADADA;border-radius:100px;background:#fff;font-family:'Inter',sans-serif;font-size:15px\">\u003coption value=\"\">Chọn khu vực…\u003c/option>\u003coption valu ">{{nearestDist}}\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:12px;line-height:1.5;color:#757575\">* Khoảng cách đường chim bay, toạ độ ước tính theo địa chỉ. Bản triển khai nên dùng khoảng cách đường bộ (VD: Google Maps).\u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n    \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">3\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">{{listTitle}}\u003c/span>\u003c/div>\u003cspan style=\"font-size:13px;color:#757575\">{{listCount}}\u003c/span>\u003c/div>\n    \u003csc-for list=\"{{results}}\" as=\"r\" hint-placeholder-count=\"6\">\n      \u003cdiv style=\"padding:14px 16px;border:1.5px solid {{r.border}};border-radius:22px;background:{{r.bg}};display:flex;gap:14px;align-items:flex-start\">\n        \u003cspan style=\"width:34px;height:34px;flex-shrink:0;border-radius:50%;background:{{r.rankBg}};color:{{r.rankColor}};display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">{{r.rank}}\u003c/span>\n        \u003cdiv style=\"flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px\">\n          \u003cspan style=\"font-size:11px;font-weight:600;letter-spacing:.08em;color:#E3121B\">{{r.group}}\u003c/span>\n          \u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:16px;font-weight:700;line-height:1.3\">{{r.name}}\u003c/span>\n          \u003cspan style=\"font-size:12px;line-height:1.45;color:#555\">{{r.addr}}\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0\">\n          \u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:16px;font-weight:700;color:#E3121B;white-space:nowrap\">{{r.dist}}\u003c/span>\n          \u003ca href=\"{{r.mapUrl}}\" style=\"font-size:12px;font-weight:600;color:#000;white-space:nowrap;border:1.5px solid #E6E6E6;border-radius:100px;padding:10px 14px;text-decoration:none\">Chỉ đường\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-for>\n  \u003c/div>\n\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { pos: null, status: 'idle', brand: 'all', area: '' };\n  }\n\n  dealers() {\n    // Nguồn: phattien.vn/he-thong-dai-ly, chỉ đại lý ôtô. Toạ độ ước tính theo địa chỉ.\n    return [{\"id\": \"d0\", \"g\": \"honda-oto\", \"group\": \"Honda Ôtô\", \"name\": \"Honda Ôtô Sài Gòn – Quận 2\", \"addr\": \"136D Mai Chí Thọ, P. Bình Trưng, TP.HCM\", \"lat\": 10.788, \"lng\": 106.74}, {\"id\": \"d1\", \"g\": \"honda-oto\", \"group\": \"Honda Ôtô\", \"name\": \"Honda Ôtô Đồng Nai – Biên Hoà\", \"addr\": \"B04 KP3, Khu thương mại Amata, P. Long Bình, Đồng Nai\", \"lat\": 10.948, \"lng\": 106.871}, {\"id\": \"d2\", \"g\": \"honda-oto\", \"group\": \"Honda Ôtô\", \"name\": \"Honda Ôtô Long An – Tân An\", \"addr\": \"86 Quốc lộ 1 (tuyến tránh), P. Long An, Tây Ninh\", \"lat\": 10.544, \"lng\": 106.402}, {\"id\": \"d3\", \"g\": \"honda-oto\", \"group\": \"Honda Ôtô\", \"name\": \"Honda Ôtô Tây Ninh – Hoà Thành\", \"addr\": \"KP Hiệp Hoà, P. Thanh Điền, Tây Ninh\", \"lat\": 11.286, \"lng\": 106.13}, {\"id\": \"d5\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota Ninh Kiều\", \"addr\": \"57 (59A) Cách Mạng Tháng Tám, P. Cái Khế, TP. Cần Thơ\", \"lat\": 10.048, \"lng\": 105.778}, {\"id\": \"d6\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota Tiền Giang\", \"addr\": \"Ấp Long Tường, X. Châu Thành, Đồng Tháp\", \"lat\": 10.35, \"lng\": 106.3}, {\"id\": \"d7\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota Bến Tre\", \"addr\": \"186A, KP Phước Thạnh, P. Sơn Đông, Vĩnh Long\", \"lat\": 10.256, \"lng\": 106.35}, {\"id\": \"d8\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota An Sương\", \"addr\": \"382 Lê Quang Đạo, P. Trung Mỹ Tây, TP.HCM\", \"lat\": 10.856, \"lng\": 106.615}, {\"id\": \"d9\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota An Sương – CN Trường Chinh\", \"addr\": \"113 Trường Chinh, P. Đông Hưng Thuận, TP.HCM\", \"lat\": 10.829, \"lng\": 106.623}, {\"id\": \"d10\", \"g\": \"mitsubishi\", \"group\": \"Mitsubishi Motors\", \"name\": \"Mitsubishi Vĩnh Long\", \"addr\": \"Tổ 10, Ấp Tân Hưng, X. Tân Hạnh, Vĩnh Long\", \"lat\": 10.23, \"lng\": 105.935}];\n  }\n\n  areas() {\n    return [{\"id\": \"hcm\", \"label\": \"TP. Hồ Chí Minh (trung tâm)\", \"lat\": 10.7769, \"lng\": 106.7009}, {\"id\": \"dongnai\", \"label\": \"Đồng Nai – Biên Hoà\", \"lat\": 10.9574, \"lng\": 106.8427}, {\"id\": \"longan\", \"label\": \"Long An – Tân An\", \"lat\": 10.5354, \"lng\": 106.4137}, {\"id\": \"tayninh\", \"label\": \"Tây Ninh\", \"lat\": 11.31, \"lng\": 106.0983}, {\"id\": \"cantho\", \"label\": \"Cần Thơ\", \"lat\": 10.0452, \"lng\": 105.7469}, {\"id\": \"vinhlong\", \"label\": \"Vĩnh Long\", \"lat\": 10.2537, \"lng\": 105.9722}, {\"id\": \"mytho\", \"label\": \"Mỹ Tho\", \"lat\": 10.36, \"lng\": 106.36}, {\"id\": \"bentre\", \"label\": \"Bến Tre\", \"lat\": 10.2433, \"lng\": 106.3756}];\n  }\n\n  brandList() {\n    return [{\"id\": \"all\", \"label\": \"Tất cả\"}, {\"id\": \"honda-oto\", \"label\": \"Honda Ôtô\"}, {\"id\": \"toyota\", \"label\": \"Toyota\"}, {\"id\": \"mitsubishi\", \"label\": \"Mitsubishi Motors\"}];\n  }\n\n  distanceKm(a, b) {\n    const R = 6371, rad = Math.PI / 180;\n    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;\n    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;\n    return 2 * R * Math.asin(Math.sqrt(h));\n  }\n\n  renderVals() {\n    const { pos, status, brand, area } = this.state;\n    let list = this.dealers().filter((d) => brand === 'all' || d.g === brand);\n    list = list.map((d) => ({ ...d, dist: pos ? this.distanceKm(pos, d) : null }));\n    if (pos) list.sort((a, b) => a.dist - b.dist);\n    const shown = list.slice(0, 6);\n    const nearest = pos && list.length ? list[0] : null;\n    const areaObj = this.areas().find((a) => a.id === area);\n    const statusMap = {\n      idle: 'Cho phép truy cập vị trí, hoặc chọn khu vực bên dưới để xếp đại lý từ gần đến xa.',\n      loading: 'Đang lấy vị trí của bạn…',\n      ok: 'Đã lấy vị trí hiện tại của bạn.',\n      area: 'Đang tính từ trung tâm khu vực: ' + (areaObj ? areaObj.label : ''),\n      denied: 'Không lấy được vị trí (bị chặn hoặc hết thời gian). Hãy chọn khu vực bên dưới.',\n      unsupported: 'Trình duyệt không hỗ trợ định vị. Hãy chọn khu vực bên dưới.'\n    };\n    return {\n      locate: () => {\n        if (!navigator.geolocation) { this.setState({ status: 'unsupported' }); return; }\n        this.setState({ status: 'loading' });\n        try {\n          navigator.geolocation.getCurrentPosition(\n            (p) => this.setState({ pos: { lat: p.coords.latitude, lng: p.coords.longitude }, status: 'ok', area: '' }),\n            () => this.setState({ status: 'denied' }),\n            { timeout: 10000, maximumAge: 60000 }\n          );\n        } catch (e) { this.setState({ status: 'denied' }); }\n      },\n      locateLabel: status === 'loading' ? 'Đang định vị…' : (status === 'ok' ? 'Cập nhật vị trí' : 'Dùng vị trí hiện tại của tôi'),\n      statusText: statusMap[status],\n      statusColor: status === 'denied' || status === 'unsupported' ? '#C40016' : '#555555',\n      areaValue: area,\n      onArea: (e) => {\n        const a = this.areas().find((x) => x.id === e.target.value);\n        if (a) this.setState({ pos: { lat: a.lat, lng: a.lng }, status: 'area', area: a.id });\n        else this.setState({ pos: null, status: 'idle', area: '' });\n      },\n      brands: this.brandList().map((b) => {\n        const on = b.id === brand;\n        return { label: b.label, border: on ? '#E3121B' : '#E6E6E6', bg: on ? '#E3121B' : '#FFFFFF', color: on ? '#FFFFFF' : '#000000', pick: () => this.setState({ brand: b.id }) };\n      }),\n      nearestName: nearest ? nearest.name : 'Chưa có vị trí',\n      nearestDist: nearest ? '~' + nearest.dist.toFixed(1) + ' km' : '— km',\n      listTitle: pos ? 'Đại lý gần bạn nhất' : 'Danh sách đại lý',\n      listCount: 'Hiển thị ' + shown.length + '/' + list.length,\n      results: shown.map((d, i) => {\n        const top = pos && i === 0;\n        return {\n          rank: pos ? String(i + 1) : '•',\n          rankBg: top ? '#E3121B' : '#F4F4F4',\n          rankColor: top ? '#FFFFFF' : '#000000',\n          border: top ? '#E3121B' : '#EEEEEE',\n          bg: top ? '#FFF1F2' : '#FFFFFF',\n          group: d.group.toUpperCase(),\n          name: d.name,\n          addr: d.addr,\n          dist: d.dist != null ? '~' + d.dist.toFixed(1) + ' km' : '—',\n          mapUrl: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(d.name + ', ' + d.addr)\n        };\n      })\n    };\n  }\n}\n","props":{}}};</script>
