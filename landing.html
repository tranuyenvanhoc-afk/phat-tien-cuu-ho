c/svg>\u003cspan>Trụ sở chính: 136D Mai Chí Thọ, P. Bình Trưng, TP. Hồ Chí Minh\u003c/span>\u003c/div>\n            \u003ca href=\"tel:0901117111\" style=\"display:flex;gap:12px;align-items:flex-start\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E3121B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex:none;margin-top:3px\">\u003cpath d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\">\u003c/path>\u003c/svg>\u003cspan>Hotline cứu hộ 24/7: 0901.117.111\u003c/span>\u003c/a>\n            \n          \u003c/div>\n        \u003c/div>\n\n      \u003c/div>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;margin-top:56px;padding:24px 0 28px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:#8E8E96\">\u003cspan>© 2026 Phát Tiến Holding. Bảo lưu mọi quyền.\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- FOOTER -->\n  \n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { sent: null, error: '', sending: false };\n  }\n\n  dlSync(el) {\n    const gal = el.closest('.pt-dl-gal'), track = gal && gal.querySelector('.pt-dl-track');\n    if (!track) return;\n    const ratio = el.clientWidth / el.scrollWidth, max = el.scrollWidth - el.clientWidth;\n    track.style.setProperty('--w', Math.min(100, ratio * 100) + '%');\n    track.style.setProperty('--x', (max > 0 ? (el.scrollLeft / max) * (1 / ratio - 1) * 100 : 0) + '%');\n    gal.classList.toggle('pt-dl-fit', max \u003c= 1);\n    const arrows = gal.querySelectorAll('.pt-dl-arrow');\n    arrows[0].disabled = el.scrollLeft \u003c= 1;\n    arrows[1].disabled = el.scrollLeft >= max - 1;\n  }\n\n  dlMove(e, dir) {\n    const el = e.currentTarget.closest('.pt-dl-gal').querySelector('.pt-dl-strip');\n    const step = el.querySelector('.pt-dl-card').offsetWidth + 18;\n    el.scrollBy({ left: dir * step, behavior: 'smooth' });\n  }\n\n  stripDrag() {\n    // Cảm ứng đã tự lướt được; đoạn này cho phép kéo bằng chuột.\n    let drag = null, moved = false;\n    this.dragDown = (e) => {\n      if (e.pointerType !== 'mouse' || e.button !== 0 || !e.target.closest) return;\n      const el = e.target.closest('.pt-steps3,.pt-gallery,.pt-dl-strip');\n      if (!el || el.scrollWidth \u003c= el.clientWidth) return;\n      drag = { el, x: e.clientX, left: el.scrollLeft };\n      moved = false;\n    };\n    this.dragMove = (e) => {\n      if (!drag) return;\n      const dx = e.clientX - drag.x;\n      if (!moved && Math.abs(dx) > 5) {\n        moved = true;\n        drag.el.style.scrollSnapType = 'none';\n        drag.el.style.scrollBehavior = 'auto';\n      }\n      if (moved) drag.el.scrollLeft = drag.left - dx;\n    };\n    this.dragUp = () => {\n      if (!drag) return;\n      const { el, left } = drag;\n      drag = null;\n      if (!moved) return;\n      const kids = [...el.children].filter((c) => c.offsetWidth > 0);\n      const stops = kids.map((c) => c.offsetLeft - kids[0].offsetLeft);\n      const forward = el.scrollLeft > left;\n      const target = forward\n        ? stops.find((v) => v > left + 1) ?? stops[stops.length - 1]\n        : [...stops].reverse().find((v) => v \u003c left - 1) ?? 0;\n      el.style.scrollBehavior = '';\n      el.scrollTo({ left: target, behavior: 'smooth' });\n      setTimeout(() => { el.style.scrollSnapType = ''; }, 450);\n    };\n    // Vừa kéo xong thì không tính là bấm vào thẻ đại lý.\n    this.dragClick = (e) => {\n      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }\n    };\n    this.dragStart = (e) => {\n      if (e.target.closest && e.target.closest('.pt-steps3,.pt-gallery,.pt-dl-strip')) e.preventDefault();\n    };\n    document.addEventListener('pointerdown', this.dragDown);\n    window.addEventListener('pointermove', this.dragMove);\n    window.addEventListener('pointerup', this.dragUp);\n    document.addEventListener('click', this.dragClick, true);\n    document.addEventListener('dragstart', this.dragStart);\n  }\n\n  componentDidMount() {\n    this.stripDrag();\n    this.dlSyncAll = () => document.querySelectorAll('.pt-dl-strip').forEach((el) => this.dlSync(el));\n    this.dlSyncAll();\n    window.addEventListener('resize', this.dlSyncAll);\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    // 1 giây dừng cộng khoảng 0,5 giây lướt.\n    const STEP_MS = 1500, HOLD_AFTER_TOUCH_MS = 4000;\n    let holdUntil = 0;\n    this.stepHold = (e) => {\n      if (e.target.closest && e.target.closest('.pt-steps3')) holdUntil = Date.now() + HOLD_AFTER_TOUCH_MS;\n    };\n    document.addEventListener('pointerdown', this.stepHold, { passive: true });\n    this.stepTimer = setInterval(() => {\n      const el = document.querySelector('.pt-steps3');\n      if (!el || document.hidden || !window.matchMedia('(max-width:760px)').matches) return;\n      const box = el.getBoundingClientRect();\n      if (box.bottom \u003c= 0 || box.top >= window.innerHeight) {\n        // Ngoài màn hình: về ô 1 để lần sau kéo tới luôn bắt đầu từ đầu.\n        el.scrollLeft = 0;\n        return;\n      }\n      if (Date.now() \u003c holdUntil) return;\n      const cards = el.children;\n      if (cards.length \u003c 2) return;\n      const span = cards[1].offsetLeft - cards[0].offsetLeft;\n      const now = Math.round(el.scrollLeft / span);\n      el.scrollTo({ left: ((now + 1) % cards.length) * span, behavior: 'smooth' });\n    }, STEP_MS);\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('pointerdown', this.dragDown);\n    window.removeEventListener('pointermove', this.dragMove);\n    window.removeEventListener('pointerup', this.dragUp);\n    document.removeEventListener('click', this.dragClick, true);\n    document.removeEventListener('dragstart', this.dragStart);\n    window.removeEventListener('resize', this.dlSyncAll);\n    clearInterval(this.stepTimer);\n    document.removeEventListener('pointerdown', this.stepHold);\n  }\n\n  async submitForm() {\n    // Link Ứng dụng web của Apps Script (tools/google-sheet-form.gs).\n    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyRD8mPIvTyeWg_aTfFm49E4gn9tl9z_VDJsu2kzbJewWP7CZHwDIcXYHdz6MvGFdAr/exec';\n    if (this.state.sending) return;\n    const val = (id) => {\n      const el = document.getElementById(id);\n      return el ? el.value.trim() : '';\n    };\n    const name = val('dk-name');\n    const phone = val('dk-phone');\n    if (!name || !phone) {\n      this.setState({ error: 'Vui lòng nhập họ tên và số điện thoại.' });\n      return;\n    }\n    if (!/^0\\d{9,10}$/.test(phone.replace(/[\\s.\\-]/g, ''))) {\n      this.setState({ error: 'Số điện thoại chưa đúng, vui lòng kiểm tra lại.' });\n      return;\n    }\n    this.setState({ sending: true, error: '' });\n    try {\n      if (!SHEET_URL) throw new Error('Chưa có link Google Sheet');\n      const stop = new AbortController();\n      const timer = setTimeout(() => stop.abort(), 15000);\n      const res = await fetch(SHEET_URL, {\n        method: 'POST',\n        body: new URLSearchParams({ name, phone, car: val('dk-car'), note: val('dk-note'), website: val('dk-web'), source: 'Landing Cứu hộ 24/7' }),\n        signal: stop.signal\n      });\n      clearTimeout(timer);\n      const data = await res.json();\n      if (!data.ok) throw new Error(data.error || 'Sheet từ chối');\n      this.setState({ sent: { name, phone }, error: '', sending: false });\n    } catch (err) {\n      this.setState({ sending: false, error: 'Chưa gửi được thông tin. Vui lòng thử lại hoặc gọi Hotline 0901.117.111.' });\n    }\n  }\n\n  renderVals() {\n    const { sent, error } = this.state;\n    const rawVideo = String(this.props.videoUrl || 'https://youtu.be/LRhtevTEXs0').trim();\n    const vm = rawVideo.match(/(?:youtu\\.be\\/|[?&]v=|embed\\/|shorts\\/|live\\/)([A-Za-z0-9_-]{11})/);\n    const videoId = vm ? vm[1] : '';\n    return {\n      onDlScroll: (e) => this.dlSync(e.currentTarget),\n      dlPrev: (e) => this.dlMove(e, -1),\n      dlNext: (e) => this.dlMove(e, 1),\n      videoWatch: videoId ? 'https://youtu.be/' + videoId : '',\n      onStepStrip: (e) => {\n        const el = e.currentTarget, bar = el && el.nextElementSibling;\n        if (!bar) return;\n        const ratio = el.clientWidth / el.scrollWidth, max = el.scrollWidth - el.clientWidth;\n        bar.style.setProperty('--w', Math.min(100, ratio * 100) + '%');\n        bar.style.setProperty('--x', (max > 0 ? (el.scrollLeft / max) * (1 / ratio - 1) * 100 : 0) + '%');\n      },\n      clipPlaying: !!(this.state && this.state.clip) && !!videoId,\n      clipIdle: !((this.state && this.state.clip) && videoId),\n      videoAutoplay: videoId ? 'https://www.youtube.com/embed/' + videoId + '?rel=0&autoplay=1&playsinline=1' : '',\n      clipMeta: this.state && this.state.clip && !videoId ? 'Clip đang được cập nhật' : 'Xem clip',\n      openClip: () => this.setState({ clip: true }),\n      perks: [\n        'Một đầu mối hỗ trợ 24/7 qua Hotline 0901.117.111',\n        'Cố vấn Dịch vụ hướng dẫn xử lý ban đầu và thủ tục liên hệ bảo hiểm',\n        'Xe được đưa về Đại lý chính hãng hoặc điểm dịch vụ phù hợp'\n      ],\n      menuOpen: !!(this.state && this.state.menu),\n      openMenu: () => this.setState({ menu: true }),\n      closeMenu: () => this.setState({ menu: false }),\n      videoEmbed: videoId ? 'https://www.youtube.com/embed/' + videoId + '?rel=0' : '',\n      hasVideo: !!videoId,\n      noVideo: !videoId,\n      packageBenefits: [\n        'Cứu kéo miễn phí trong bán kính 100 km',\n        'Một đầu mối hỗ trợ 24/7, bất kể ngày hay đêm',\n        'Cố vấn Dịch vụ tư vấn xử lý ban đầu và thủ tục bảo hiểm',\n        'Không phải tự tìm đơn vị cứu hộ lúc khẩn cấp'\n      ],\n      formOpen: !sent,\n      formSent: !!sent,\n      formError: error,\n      sentName: sent ? sent.name : '',\n      sentPhone: sent ? sent.phone : '',\n      submitForm: () => this.submitForm(),\n      submitLabel: this.state.sending ? 'Đang gửi…' : 'Đăng ký gói 500.000 VNĐ/năm',\n      resetForm: () => this.setState({ sent: null, error: '' }),\n      packagePerks: [\n        'Một đầu mối hỗ trợ 24/7 qua Hotline 0901.117.111',\n        'Cứu kéo miễn phí trong bán kính 100 km (vượt 100 km: 25.000 VNĐ/km)',\n        'Cố vấn Dịch vụ hướng dẫn xử lý ban đầu và thủ tục liên hệ bảo hiểm',\n        'Xe được đưa về Đại lý chính hãng hoặc điểm dịch vụ phù hợp'\n      ],\n      dealerNames: ['Honda Ôtô Sài Gòn – Quận 2', 'Honda Ôtô Đồng Nai – Biên Hoà', 'Honda Ôtô Long An – Tân An', 'Honda Ôtô Tây Ninh – Hoà Thành', 'Toyota Ninh Kiều', 'Toyota Tiền Giang', 'Toyota Bến Tre', 'Toyota An Sương', 'Toyota An Sương – CN Trường Chinh', 'Mitsubishi Vĩnh Long'],\n      heroStats: [\n        { big: '24/7', unit: '', desc: 'Hỗ trợ bất kể ngày hay đêm khi xe gặp sự cố' },\n        { big: '100', unit: ' km', desc: 'Cứu kéo miễn phí ' },\n        { big: '10', unit: ' đại lý', desc: 'Đại lý ôtô chính hãng' },\n        { big: '500K', unit: '/năm', desc: 'Phí tham gia Gói Cứu hộ 24/7' }\n      ],\n      scopeOnsite: ['Hết ắc quy', 'Hết nhiên liệu', 'Sự cố lốp', 'Xe báo lỗi', 'Xe không thể tiếp tục di chuyển'],\n      scopeTow: ['Xe chết máy', 'Tai nạn', 'Mất chìa khóa', 'Sự cố phanh – lái', 'Thủy kích / ngập nước', 'Sự cố liên quan đến nhiên liệu'],\n      prices: [\n        { range: '≤ 10 km', value: '600.000', unit: 'VNĐ/chuyến', desc: 'Đơn giá trọn chuyến trong phạm vi 10 km.' },\n        { range: '> 10 km', value: '+25.000', unit: 'VNĐ × mỗi km vượt', desc: '600.000 VNĐ/chuyến cộng 25.000 VNĐ cho mỗi km vượt quá 10 km.' }\n      ],\n      steps: [\n        { n: '01', title: 'Gọi Hotline', desc: 'Gọi ngay 0901.117.111, tổng đài trực 24/7.' },\n        { n: '02', title: 'CVDV tiếp nhận và tư vấn', desc: 'Khách hàng cung cấp vị trí và tình trạng xe.' },\n        { n: '03', title: 'Ứng cứu ho \"font-size:13px;line-height:1.5;color:{{statusColor}}\">{{statusText}}\u003c/div>\n      \u003cdiv class=\"pt-calc-kmbox\" style=\"display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#F6F6F6;border-radius:20px\">\n        \u003clabel for=\"pt-km\" style=\"font-size:14px;font-weight:600\">Hoặc nhập khoảng cách (km)\u003c/label>\n        \u003cdiv style=\"display:flex;gap:14px;align-items:center\">\n          \u003cinput id=\"pt-km\" type=\"number\" min=\"0\" max=\"500\" value=\"{{kmValue}}\" onChange=\"{{onKm}}\" style=\"width:96px;height:46px;box-sizing:border-box;padding:0 14px;border:1.5px solid #DADADA;border-radius:100px;font-family:'Inter',sans-serif;font-size:16px;font-weight:700\">\n          \u003cinput type=\"range\" min=\"0\" max=\"200\" value=\"{{kmValue}}\" onChange=\"{{onKm}}\" aria-label=\"Kéo để chọn số km\" style=\"flex-grow:1;accent-color:#E3121B\">\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n      \u003cdiv class=\"pt-calc-step\" style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, rgb(242, 34, 43), rgb(158, 0, 18)); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center; font-family: &quot;Inter Tight&quot;, sans-serif; font-weight: 700; font-size: 14px\">2\u003c/span>\u003cspan style=\"font-family: &quot;Inter Tight&quot;, sans-serif; font-size: 19px; font-weight: 600\">Chọn đại lý cứu kéo xe của bạn\u003c/span>\u003c/div>\n      \u003clabel for=\"pt-dealer\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">Đại lý nhận xe\u003c/label>\n      \u003cselect class=\"pt-calc-sel\" id=\"pt-dealer\" value=\"{{pickedValue}}\" onChange=\"{{onPick}}\" style=\"height:56px;box-sizing:border-box;padding:0 20px;border:1.5px solid #E3121B;border-radius:100px;background:#fff;font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:#000;cursor:pointer\">\n        \u003coption value=\"\">Chọn đại lý nhận xe…\u003c/option>\n        \u003csc-for list=\"{{dealers}}\" as=\"d\" hint-placeholder-count=\"10\">\u003coption value=\"{{d.id}}\">{{d.label}}\u003c/option>\u003c/sc-for>\n      \u003c/select>\n\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- RESULTS -->\n  \u003cdiv class=\"pt-calc-out\" style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv class=\"pt-calc-step\" style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, rgb(242, 34, 43), rgb(158, 0, 18)); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center; font-family: &quot;Inter Tight&quot;, sans-serif; font-weight: 700; font-size: 14px\">3\u003c/span>\u003cspan style=\"font-family: &quot;Inter Tight&quot;, sans-serif; font-size: 19px; font-weight: 600\">{{step3Title}}\u003c/span>\u003c/div>\n\n    \u003cdiv class=\"pt-calc-km\" style=\"padding:22px 24px;background:#F6F6F6;border-radius:24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 12px\">\n      \u003cspan style=\"font-size:14px;color:#555\">{{routeLabel}}\u003c/span>\n      \u003cspan class=\"pt-calc-kmt\" style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,#9E0012,#F2222B);-webkit-background-clip:text;background-clip:text;color:transparent\">{{kmText}}\u003c/span>\n    \u003c/div>\n\n    \u003cdiv class=\"pt-calc-pack\" style=\"padding:26px 28px;border-radius:24px;background:linear-gradient(150deg,#F2222B,#9E0012);color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 36px rgba(227,18,27,.3)\">\n      \u003cdiv class=\"pt-calc-packhd\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px\">\n        \u003cspan class=\"pt-calc-lbl\" style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85\">Khách có Gói Cứu hộ 24/7\u003c/span>\n        \u003ca class=\"pt-calc-reg\" href=\"#dang-ky-goi\" style=\"background:#fff;color:#C40016;font-size:13px;font-weight:700;padding:13px 16px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;border-radius:100px;text-decoration:none\">Đăng ký gói\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"pt-calc-packt\" style=\"font-family:'Inter Tight',sans-serif;font-size:52px;line-height:1;font-weight:700;letter-spacing:-.03em\">{{packText}}\u003c/div>\n      \u003cdiv class=\"pt-calc-note\" style=\"display:inline-flex;align-self:flex-start;background:rgba(255,255,255,.16);border-radius:100px;padding:8px 14px;font-size:14px;font-weight:600\">{{packNote}}\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"pt-calc-pay\" style=\"padding:24px 28px;border-radius:24px;border:1.5px solid #E6E6E6;display:flex;flex-direction:column;gap:8px\">\n      \u003cspan class=\"pt-calc-lbl\" style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#555\">Chưa có gói · cứu kéo theo chuyến\u003c/span>\n      \u003cdiv class=\"pt-calc-payt\" style=\"font-family:'Inter Tight',sans-serif;font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.02em\">{{payText}}\u003c/div>\n      \u003cdiv class=\"pt-calc-bd\" style=\"font-size:14px;color:#555\">{{payBreakdown}}\u003c/div>\n    \u003c/div>\n\n\n\n  \u003c/div>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { km: 15, pos: null, status: 'idle', picked: null, mode: 'manual' };\n  }\n\n  dealersData() {\n    // 10 đại lý ôtô Phát Tiến; toạ độ ước tính theo địa chỉ.\n    return [\n      { id: 'c0', name: 'Honda Ôtô Sài Gòn – Quận 2', area: '136D Mai Chí Thọ, P. Bình Trưng, TP.HCM', lat: 10.788, lng: 106.74 },\n      { id: 'c1', name: 'Honda Ôtô Đồng Nai – Biên Hoà', area: 'B04 KP3, Khu thương mại Amata, P. Long Bình, Đồng Nai', lat: 10.948, lng: 106.871 },\n      { id: 'c2', name: 'Honda Ôtô Long An – Tân An', area: '86 Quốc lộ 1 (tuyến tránh), P. Long An, Tây Ninh', lat: 10.544, lng: 106.402 },\n      { id: 'c3', name: 'Honda Ôtô Tây Ninh – Hoà Thành', area: 'KP Hiệp Hoà, P. Thanh Điền, Tây Ninh', lat: 11.286, lng: 106.13 },\n      { id: 'c5', name: 'Toyota Ninh Kiều', area: '57 (59A) Cách Mạng Tháng Tám, P. Cái Khế, TP. Cần Thơ', lat: 10.048, lng: 105.778 },\n      { id: 'c6', name: 'Toyota Tiền Giang', area: 'Ấp Long Tường, X. Châu Thành, Đồng Tháp', lat: 10.35, lng: 106.3 },\n      { id: 'c7', name: 'Toyota Bến Tre', area: '186A, KP Phước Thạnh, P. Sơn Đông, Vĩnh Long', lat: 10.256, lng: 106.35 },\n      { id: 'c8', name: 'Toyota An Sương', area: '382 Lê Quang Đạo, P. Trung Mỹ Tây, TP.HCM', lat: 10.856, lng: 106.615 },\n      { id: 'c9', name: 'Toyota An Sương – CN Trường Chinh', area: '113 Trường Chinh, P. Đông Hưng Thuận, TP.HCM', lat: 10.829, lng: 106.623 },\n      { id: 'c10', name: 'Mitsubishi Vĩnh Long', area: 'Tổ 10, Ấp Tân Hưng, X. Tân Hạnh, Vĩnh Long', lat: 10.23, lng: 105.935 }\n    ];\n  }\n\n  distanceKm(a, b) {\n    const R = 6371, rad = Math.PI / 180;\n    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;\n    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;\n    return 2 * R * Math.asin(Math.sqrt(h));\n  }\n\n  locate() {\n    if (!navigator.geolocation) { this.setState({ status: 'unsupported' }); return; }\n    this.setState({ status: 'loading' });\n    try {\n      navigator.geolocation.getCurrentPosition(\n        (p) => this.setState({ pos: { lat: p.coords.latitude, lng: p.coords.longitude }, status: 'ok', mode: 'gps' }),\n        () => this.setState({ status: 'denied' }),\n        { timeout: 10000, maximumAge: 60000 }\n      );\n    } catch (e) { this.setState({ status: 'denied' }); }\n  }\n\n  money(v) {\n    return v.toLocaleString('vi-VN') + ' VNĐ';\n  }\n\n  renderVals() {\n    const { pos, status, mode } = this.state;\n    let list = this.dealersData().map((d) => ({ ...d, dist: pos ? this.distanceKm(pos, d) : null }));\n    if (pos) list.sort((a, b) => a.dist - b.dist);\n    const pickedId = this.state.picked || (pos ? list[0].id : null);\n    const picked = list.find((d) => d.id === pickedId) || null;\n\n    const useGps = mode === 'gps' && picked && picked.dist != null;\n    const km = useGps ? Math.ceil(picked.dist) : Math.max(0, Math.round(this.state.km || 0));\n    const over = Math.max(0, km - 10);\n    const pay = 600000 + 25000 * over;\n    // Gói Cứu hộ 24/7: miễn phí cứu kéo trong 100 km, phần vượt 25.000 VNĐ/km.\n    const packOver = Math.max(0, km - 100);\n    const packPay = 25000 * packOver;\n\n    const statusMap = {\n      idle: 'Cho phép truy cập vị trí để tìm đại lý gần nhất, hoặc nhập số km bên dưới.',\n      loading: 'Đang lấy vị trí của bạn…',\n      ok: 'Đã lấy vị trí. Danh sách đại lý đã xếp từ gần đến xa.',\n      denied: 'Không lấy được vị trí (bị chặn hoặc hết thời gian). Hãy nhập số km bên dưới.',\n      unsupported: 'Trình duyệt không hỗ trợ định vị. Hãy nhập số km bên dưới.'\n    };\n\n    return {\n      locate: () => this.locate(),\n      locateLabel: status === 'loading' ? 'Đang định vị…' : (pos ? 'Cập nhật vị trí' : 'Dùng vị trí hiện tại của tôi'),\n      statusText: picked && !pos && (status === 'denied' || status === 'unsupported')\n        ? 'Không lấy được vị trí để đo tới ' + picked.name + '. Hãy nhập số km từ chỗ bạn tới đại lý ở ô bên dưới.'\n        : statusMap[status],\n      statusCls: status === 'idle' ? 'pt-calc-idle' : '',\n      statusColor: status === 'denied' || status === 'unsupported' ? '#C40016' : '#555555',\n      kmValue: km,\n      onKm: (e) => this.setState({ km: Math.max(0, Number(e.target.value) || 0), mode: 'manual' }),\n      dealers: list.map((d) => ({\n        id: d.id,\n        label: d.name + (d.dist != null ? ' · ~' + d.dist.toFixed(1) + ' km' : '')\n      })),\n      pickedValue: pickedId || '',\n      pickedAddr: picked ? picked.area : 'Chọn đại lý để xem địa chỉ. Dùng vị trí hiện tại để xếp đại lý từ gần đến xa.',\n      onPick: (e) => {\n        const id = e.target.value || null;\n        this.setState({ picked: id, mode: pos ? 'gps' : 'manual' });\n        // Chưa có vị trí thì lấy luôn để đo km tới đại lý vừa chọn\n        if (id && !pos && status !== 'loading') this.locate();\n      },\n      routeLabel: useGps ? 'Từ vị trí của bạn tới ' + picked.name\n        : picked ? (status === 'loading' ? 'Đang đo khoảng cách tới ' + picked.name + '…' : 'Tới ' + picked.name + ' (nhập tay)')\n        : 'Khoảng cách cứu kéo (nhập tay)',\n      kmText: km + ' km',\n      step3Title: km > 100 ? 'Chi phí ước tính' : 'Chi phí ước tính nếu không có gói Cứu hộ 24/7',\n      payText: this.money(pay),\n      packText: packPay === 0 ? 'Miễn phí' : this.money(packPay),\n      packNote: packOver > 0\n        ? 'Miễn phí 100 km đầu · 25.000 × ' + packOver + ' km vượt'\n        : 'Trong bán kính 100 km: miễn phí cứu kéo',\n      payBreakdown: over > 0\n        ? '600.000 + 25.000 × ' + over + ' km vượt'\n        : 'Trong phạm vi 10 km: 600.000 VNĐ/chuyến'\n    };\n  }\n}\n","props":{}}};</script>
