003c/span>\u003c/a>\n            \n            \u003cdiv style=\"display:flex;gap:12px;align-items:flex-start\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E3121B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex:none;margin-top:3px\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"M12 7v5l3 2\">\u003c/path>\u003c/svg>\u003cspan>Showroom: Thứ 2 — Chủ nhật, 7:30 — 18:00\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n      \u003c/div>\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;margin-top:56px;padding:24px 0 28px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:#8E8E96\">\n        \u003cspan>© 2026 Phát Tiến Holding. Bảo lưu mọi quyền.\u003c/span>\n        \u003cspan>Cứu hộ 24 giờ/ngày • 7 ngày/tuần\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { sent: null, error: '' };\n  }\n\n  submitForm() {\n    const val = (id) => {\n      const el = document.getElementById(id);\n      return el ? el.value.trim() : '';\n    };\n    const name = val('dk-name');\n    const phone = val('dk-phone');\n    const plate = val('dk-plate');\n    if (!name || !phone || !plate) {\n      this.setState({ error: 'Vui lòng nhập họ tên, số điện thoại và biển số xe.' });\n      return;\n    }\n    if (!/^0\\d{9,10}$/.test(phone.replace(/[\\s.\\-]/g, ''))) {\n      this.setState({ error: 'Số điện thoại chưa đúng, vui lòng kiểm tra lại.' });\n      return;\n    }\n    this.setState({ sent: { name, phone }, error: '' });\n  }\n\n  renderVals() {\n    const { sent, error } = this.state;\n    return {\n      formOpen: !sent,\n      formSent: !!sent,\n      formError: error,\n      sentName: sent ? sent.name : '',\n      sentPhone: sent ? sent.phone : '',\n      submitForm: () => this.submitForm(),\n      resetForm: () => this.setState({ sent: null, error: '' }),\n      packagePerks: [\n        'Một đầu mối hỗ trợ 24/7 qua Hotline 0901.117.111',\n        'Cứu kéo miễn phí trong bán kính 100 km (vượt 100 km: 25.000 VNĐ/km)',\n        'Cố vấn Dịch vụ hướng dẫn xử lý ban đầu và thủ tục liên hệ bảo hiểm',\n        'Xe được đưa về Đại lý chính hãng hoặc điểm dịch vụ phù hợp'\n      ],\n      dealerNames: ['Honda Ôtô Sài Gòn – Quận 2', 'Honda Ôtô Đồng Nai – Biên Hoà', 'Honda Ôtô Long An – Tân An', 'Honda Ôtô Tây Ninh – Hoà Thành', 'Toyota Ninh Kiều', 'Toyota Tiền Giang', 'Toyota Bến Tre', 'Toyota An Sương', 'Toyota An Sương – CN Trường Chinh', 'Mitsubishi Vĩnh Long'],\n      heroStats: [\n        { big: '24/7', unit: '', desc: 'Liên hệ bất kể ngày hay đêm khi xe gặp sự cố' },\n        { big: '100', unit: ' km', desc: 'Cứu kéo miễn phí cho khách có Gói Cứu hộ 24/7' },\n        { big: '10', unit: ' đại lý', desc: 'Đại lý ôtô chính hãng Phát Tiến sẵn sàng nhận xe' },\n        { big: '500K', unit: '/năm', desc: 'Phí tham gia Gói Cứu hộ 24/7' }\n      ],\n      scopeOnsite: ['Hết ắc quy', 'Hết nhiên liệu', 'Sự cố lốp', 'Xe báo lỗi', 'Xe không thể tiếp tục di chuyển'],\n      scopeTow: ['Xe chết máy', 'Tai nạn', 'Mất chìa khóa', 'Sự cố phanh – lái', 'Thủy kích / ngập nước', 'Sự cố liên quan đến nhiên liệu'],\n      prices: [\n        { range: '≤ 10 km', value: '600.000', unit: 'VNĐ/chuyến', desc: 'Đơn giá trọn chuyến trong phạm vi 10 km.' },\n        { range: '> 10 km', value: '+25.000', unit: 'VNĐ × mỗi km vượt', desc: '600.000 VNĐ/chuyến cộng 25.000 VNĐ cho mỗi km vượt quá 10 km.' }\n      ],\n      steps: [\n        { n: '01', title: 'Gọi Hotline', desc: 'Gọi ngay 0901.117.111, tổng đài trực 24/7.' },\n        { n: '02', title: 'CVDV tiếp nhận và tư vấn', desc: 'Khách hàng cung cấp vị trí và tình trạng xe.' },\n        { n: '03', title: 'Ứng cứu hoặc cứu kéo', desc: 'Điều phối cứu hộ, đưa xe về Đại lý hoặc điểm dịch vụ phù hợp và cập nhật cho bạn đến khi hoàn tất.' }\n      ]\n    };\n  }\n}\n"},"PTKmCalc":{"tpl":"\n\u003chelmet>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width:100%;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;color:#000;background:#fff;border:1.5px solid #F7B4B7;border-radius:32px;padding:clamp(18px,3vw,32px);box-shadow:0 16px 50px rgba(227,18,27,.1);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start\">\n\n  \u003c!-- INPUTS -->\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:24px\">\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n      \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">1\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Vị trí của bạn\u003c/span>\u003c/div>\n      \u003cbutton type=\"button\" onClick=\"{{locate}}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border:0;border-radius:100px;background:#111;color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer\">\n        \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\">\u003c/circle>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3\">\u003c/path>\u003ccircle cx=\"12\" cy=\"12\" r=\"7\">\u003c/circle>\u003c/svg>\n        \u003cspan>{{locateLabel}}\u003c/span>\n      \u003c/button>\n      \u003cdiv style=\"font-size:13px;line-height:1.5;color:{{statusColor}}\">{{statusText}}\u003c/div>\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#F6F6F6;border-radius:20px\">\n        \u003clabel for=\"pt-km\" style=\"font-size:14px;font-weight:600\">Hoặc nhập khoảng cách (km)\u003c/label>\n        \u003cdiv style=\"display:flex;gap:14px;align-items:center\">\n          \u003cinput id=\"pt-km\" type=\"number\" min=\"0\" max=\"500\" value=\"{{kmValue}}\" onChange=\"{{onKm}}\" style=\"width:96px;height:46px;box-sizing:border-box;padding:0 14px;border:1.5px solid #DADADA;border-radius:100px;font-family:'Inter',sans-serif;font-size:16px;font-weight:700\">\n          \u003cinput type=\"range\" min=\"0\" max=\"200\" value=\"{{kmValue}}\" onChange=\"{{onKm}}\" aria-label=\"Kéo để chọn số km\" style=\"flex-grow:1;accent-color:#E3121B\">\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n      \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">2\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Chọn đại lý nhận xe\u003c/span>\u003c/div>\n      \u003clabel for=\"pt-dealer\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">Đại lý nhận xe\u003c/label>\n      \u003cselect id=\"pt-dealer\" value=\"{{pickedValue}}\" onChange=\"{{onPick}}\" style=\"height:56px;box-sizing:border-box;padding:0 20px;border:1.5px solid #E3121B;border-radius:100px;background:#fff;font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:#000;cursor:pointer\">\n        \u003coption value=\"\">Chọn đại lý nhận xe…\u003c/option>\n        \u003csc-for list=\"{{dealers}}\" as=\"d\" hint-placeholder-count=\"10\">\u003coption value=\"{{d.id}}\">{{d.label}}\u003c/option>\u003c/sc-for>\n      \u003c/select>\n      \u003cdiv style=\"display:flex;gap:10px;align-items:flex-start;padding:14px 18px;background:#F6F6F6;border-radius:20px;font-size:13px;line-height:1.5;color:#555\">\n        \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E3121B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex:none;margin-top:1px\">\u003cpath d=\"M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z\">\u003c/path>\u003ccircle cx=\"12\" cy=\"9\" r=\"2.5\">\u003c/circle>\u003c/svg>\n        \u003cspan>{{pickedAddr}}\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"font-size:12px;line-height:1.5;color:#757575\">* 10 đại lý ôtô, địa chỉ do Phát Tiến cung cấp; toạ độ ước tính theo địa chỉ. Khoảng cách tính theo đường chim bay; bản triển khai nên dùng khoảng cách đường bộ (VD: Google Maps).\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- RESULTS -->\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:16px\">\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">3\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Chi phí ước tính\u003c/span>\u003c/div>\n\n    \u003cdiv style=\"padding:22px 24px;background:#F6F6F6;border-radius:24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 12px\">\n      \u003cspan style=\"font-size:14px;color:#555\">{{routeLabel}}\u003c/span>\n      \u003cspan style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,#9E0012,#F2222B);-webkit-background-clip:text;background-clip:text;color:transparent\">{{kmText}}\u003c/span>\n    \u003c/div>\n\n    \u003cdiv style=\"padding:26px 28px;border-radius:24px;background:linear-gradient(150deg,#F2222B,#9E0012);color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 36px rgba(227,18,27,.3)\">\n      \u003cdiv style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px\">\n        \u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85\">Khách có Gói Cứu hộ 24/7\u003c/span>\n        \u003ca href=\"#dang-ky-goi\" style=\"background:#fff;color:#C40016;font-size:13px;font-weight:700;padding:10px 14px;border-radius:100px;text-decoration:none\">Đăng ký gói\u003c/a>\n      \u003c/div>\n      \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-size:52px;line-height:1;font-weight:700;letter-spacing:-.03em\">{{packText}}\u003c/div>\n      \u003cdiv style=\"display:inline-flex;align-self:flex-start;background:rgba(255,255,255,.16);border-radius:100px;padding:8px 14px;font-size:14px;font-weight:600\">{{packNote}}\u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"padding:24px 28px;border-radius:24px;border:1.5px solid #E6E6E6;display:flex;flex-direction:column;gap:8px\">\n      \u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#555\">Chưa có gói · đơn giá vận chuyển tham chiếu\u003c/span>\n      \u003cdiv style=\"font-family:'Inter Tight',sans-serif;font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.02em\">{{payText}}\u003c/div>\n      \u003cdiv style=\"font-size:14px;color:#555\">{{payBreakdown}}\u003c/div>\n    \u003c/div>\n\n    \u003ca href=\"tel:0901117111\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;background:#111;color:#fff;border-radius:100px;text-decoration:none;font-weight:600;font-size:16px\">\n      \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\">\u003c/path>\u003c/svg>\n      Cần cứu hộ ngay? Gọi 0901.117.111\n    \u003c/a>\n    \u003cdiv style=\"font-size:12px;line-height:1.5;color:#757575;text-align:center\">Chi phí cuối cùng do chuyên viên dịch vụ xác nhận khi tiếp nhận.\u003c/div>\n  \u003c/div>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { km: 15, pos: null, status: 'idle', picked: null, mode: 'manual' };\n  }\n\n  dealersData() {\n    // 10 đại lý ôtô Phát Tiến; toạ độ ước tính theo địa chỉ.\n    return [\n      { id: 'c0', name: 'Honda Ôtô Sài Gòn – Quận 2', area: '136D Mai Chí Thọ, P. Bình Trưng, TP.HCM', lat: 10.788, lng: 106.74 },\n      { id: 'c1', name: 'Honda Ôtô Đồng Nai – Biên Hoà', area: 'B04 KP3, Khu thương mại Amata, P. Long Bình, Đồng Nai', lat: 10.948, lng: 106.871 },\n      { id: 'c2', name: 'Honda Ôtô Long An – Tân An', area: '86 Quốc lộ 1 (tuyến tránh), P. Long An, Tây Ninh', lat: 10.544, lng: 106.402 },\n      { id: 'c3', name: 'Honda Ôtô Tây Ninh – Hoà Thành', area: 'KP Hiệp Hoà, P. Thanh Điền, Tây Ninh', lat: 11.286, lng: 106.13 },\n      { id: 'c5', name: 'Toyota Ninh Kiều', area: '57 (59A) Cách Mạng Tháng Tám, P. Cái Khế, TP. Cần Thơ', lat: 10.048, lng: 105.778 },\n      { id: 'c6', name: 'Toyota Tiền Giang', area: 'Ấp Long Tường, X. Châu Thành, Đồng Tháp', lat: 10.35, lng: 106.3 },\n      { id: 'c7', name: 'Toyota Bến Tre', area: '186A, KP Phước Thạnh, P. Sơn Đông, Vĩnh Long', lat: 10.256, lng: 106.35 },\n      { id: 'c8', name: 'Toyota An Sương', area: '382 Lê Quang Đạo, P. Trung Mỹ Tây, TP.HCM', lat: 10.856, lng: 106.615 },\n      { id: 'c9', name: 'Toyota An Sương – CN Trường Chinh', area: '113 Trường Chinh, P. Đông Hưng Thuận, TP.HCM', lat: 10.829, lng: 106.623 },\n      { id: 'c10', name: 'Mitsubishi Vĩnh Long', area: 'Tổ 10, Ấp Tân Hưng, X. Tân Hạnh, Vĩnh Long', lat: 10.23, lng: 105.935 }\n    ];\n  }\n\n  distanceKm(a, b) {\n    const R = 6371, rad = Math.PI / 180;\n    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;\n    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;\n    return 2 * R * Math.asin(Math.sqrt(h));\n  }\n\n  money(v) {\n    return v.toLocaleString('vi-VN') + ' VNĐ';\n  }\n\n  renderVals() {\n    const { pos, status, mode } = this.state;\n    let list = this.dealersData().map((d) => ({ ...d, dist: pos ? this.distanceKm(pos, d) : null }));\n    if (pos) list.sort((a, b) => a.dist - b.dist);\n    const pickedId = this.state.picked || (pos ? list[0].id : null);\n    const picked = list.find((d) => d.id === pickedId) || null;\n\n    const useGps = mode === 'gps' && picked && picked.dist != null;\n    const km = useGps ? Math.ceil(picked.dist) : Math.max(0, Math.round(this.state.km || 0));\n    const over = Math.max(0, km - 10);\n    const pay = 600000 + 25000 * over;\n    // Gói Cứu hộ 24/7: miễn phí cứu kéo trong 100 km, phần vượt 25.000 VNĐ/km.\n    const packOver = Math.max(0, km - 100);\n    const packPay = 25000 * packOver;\n\n    const statusMap = {\n      idle: 'Cho phép truy cập vị trí để tìm đại lý gần nhất, hoặc nhập số km bên dưới.',\n      loading: 'Đang lấy vị trí của bạn…',\n      ok: 'Đã lấy vị trí. Danh sách đại lý đã xếp từ gần đến xa.',\n      denied: 'Không lấy được vị trí (bị chặn hoặc hết thời gian). Hãy nhập số km bên dưới.',\n      unsupported: 'Trình duyệt không hỗ trợ định vị. Hãy nhập số km bên dưới.'\n    };\n\n    return {\n      locate: () => {\n        if (!navigator.geolocation) { this.setState({ status: 'unsupported' }); return; }\n        this.setState({ status: 'loading' });\n        try {\n          navigator.geolocation.getCurrentPosition(\n            (p) => this.setState({ pos: { lat: p.coords.latitude, lng: p.coords.longitude }, status: 'ok', mode: 'gps', picked: null }),\n            () => this.setState({ status: 'denied' }),\n            { timeout: 10000, maximumAge: 60000 }\n          );\n        } catch (e) { this.setState({ status: 'denied' }); }\n      },\n      locateLabel: status === 'loading' ? 'Đang định vị…' : (pos ? 'Cập nhật vị trí' : 'Dùng vị trí hiện tại của tôi'),\n      statusText: statusMap[status],\n      statusColor: status === 'denied' || status === 'unsupported' ? '#C40016' : '#555555',\n      kmValue: km,\n      onKm: (e) => this.setState({ km: Math.max(0, Number(e.target.value) || 0), mode: 'manual' }),\n      dealers: list.map((d) => ({\n        id: d.id,\n        label: d.name + (d.dist != null ? ' · ~' + d.dist.toFixed(1) + ' km' : '')\n      })),\n      pickedValue: pickedId || '',\n      pickedAddr: picked ? picked.area : 'Chọn đại lý để xem địa chỉ. Dùng vị trí hiện tại để xếp đại lý từ gần đến xa.',\n      onPick: (e) => this.setState({ picked: e.target.value || null, mode: pos ? 'gps' : 'manual' }),\n      routeLabel: useGps ? 'Từ vị trí của bạn tới ' + picked.name : 'Khoảng cách cứu kéo (nhập tay)',\n      kmText: km + ' km',\n      payText: this.money(pay),\n      packText: packPay === 0 ? 'Miễn phí' : this.money(packPay),\n      packNote: packOver > 0\n        ? 'Miễn phí 100 km đầu · 25.000 × ' + packOver + ' km vượt'\n        : 'Trong bán kính 100 km: miễn phí cứu kéo',\n      payBreakdown: over > 0\n        ? '600.000 + 25.000 × ' + over + ' km vượt'\n        : 'Trong phạm vi 10 km: 600.000 VNĐ/chuyến'\n    };\n  }\n}\n"},"PTDealerFinder":{"tpl":"\n\u003chelmet>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width:100%;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;color:#000;background:#fff;border:1.5px solid #F7B4B7;border-radius:32px;padding:clamp(18px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start\">\n\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:18px\">\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">1\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Vị trí của bạn\u003c/span>\u003c/div>\n    \u003cbutton type=\"button\" onClick=\"{{locate}}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border:0;border-radius:100px;background:#111;color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;cursor:pointer\">\n      \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\">\u003c/circle>\u003cpath d=\"M12 2v3M12 19v3M2 12h3M19 12h3\">\u003c/path>\u003ccircle cx=\"12\" cy=\"12\" r=\"7\">\u003c/circle>\u003c/svg>\n      \u003cspan>{{locateLabel}}\u003c/span>\n    \u003c/button>\n    \u003cdiv style=\"font-size:13px;line-height:1.5;color:{{statusColor}}\">{{statusText}}\u003c/div>\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#F6F6F6;border-radius:20px\">\n      \u003clabel for=\"pt-area\" style=\"font-size:14px;font-weight:600\">Hoặc chọn khu vực của bạn\u003c/label>\n      \u003cselect id=\"pt-area\" value=\"{{areaValue}}\" onChange=\"{{onArea}}\" style=\"height:48px;box-sizing:border-box;padding:0 16px;border:1.5px solid #DADADA;border-radius:100px;background:#fff;font-family:'Inter',sans-serif;font-size:15px\">\u003coption value=\"\">Chọn khu vực…\u003c/option>\u003coption value=\"hcm\">TP. Hồ Chí Minh (trung tâm)\u003c/option>\u003coption value=\"dongnai\">Đồng Nai – Biên Hoà\u003c/option>\u003coption value=\"longan\">Long An – Tân An\u003c/option>\u003coption value=\"tayninh\">Tây Ninh\u003c/option>\u003coption value=\"cantho\">Cần Thơ\u003c/option>\u003coption value=\"vinhlong\">Vĩnh Long\u003c/option>\u003coption value=\"mytho\">Mỹ Tho\u003c/option>\u003coption value=\"bentre\">Bến Tre\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">2\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">Loại đại lý\u003c/span>\u003c/div>\n    \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px\">\n      \u003csc-for list=\"{{brands}}\" as=\"b\" hint-placeholder-count=\"4\">\n        \u003cbutton type=\"button\" onClick=\"{{b.pick}}\" style=\"min-height:40px;padding:0 16px;border-radius:100px;border:1.5px solid {{b.border}};background:{{b.bg}};color:{{b.color}};font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer\">{{b.label}}\u003c/button>\n      \u003c/sc-for>\n    \u003c/div>\n    \u003cdiv style=\"padding:22px 24px;border-radius:24px;background:linear-gradient(150deg,#F2222B,#9E0012);color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 14px 36px rgba(227,18,27,.3)\">\n      \u003cspan style=\"font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85\">Đại lý gần nhất\u003c/span>\n      \u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:700\">{{nearestName}}\u003c/span>\n      \u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:48px;line-height:1;font-weight:700;letter-spacing:-.03em\">{{nearestDist}}\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:12px;line-height:1.5;color:#757575\">* Khoảng cách đường chim bay, toạ độ ước tính theo địa chỉ. Bản triển khai nên dùng khoảng cách đường bộ (VD: Google Maps).\u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n    \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\u003cdiv style=\"display:flex;align-items:center;gap:10px\">\u003cspan style=\"width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F2222B,#9E0012);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">3\u003c/span>\u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:19px;font-weight:600\">{{listTitle}}\u003c/span>\u003c/div>\u003cspan style=\"font-size:13px;color:#757575\">{{listCount}}\u003c/span>\u003c/div>\n    \u003csc-for list=\"{{results}}\" as=\"r\" hint-placeholder-count=\"6\">\n      \u003cdiv style=\"padding:14px 16px;border:1.5px solid {{r.border}};border-radius:22px;background:{{r.bg}};display:flex;gap:14px;align-items:flex-start\">\n        \u003cspan style=\"width:34px;height:34px;flex-shrink:0;border-radius:50%;background:{{r.rankBg}};color:{{r.rankColor}};display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:14px\">{{r.rank}}\u003c/span>\n        \u003cdiv style=\"flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px\">\n          \u003cspan style=\"font-size:11px;font-weight:600;letter-spacing:.08em;color:#E3121B\">{{r.group}}\u003c/span>\n          \u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:16px;font-weight:700;line-height:1.3\">{{r.name}}\u003c/span>\n          \u003cspan style=\"font-size:12px;line-height:1.45;color:#555\">{{r.addr}}\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0\">\n          \u003cspan style=\"font-family:'Inter Tight',sans-serif;font-size:16px;font-weight:700;color:#E3121B;white-space:nowrap\">{{r.dist}}\u003c/span>\n          \u003ca href=\"{{r.mapUrl}}\" style=\"font-size:12px;font-weight:600;color:#000;white-space:nowrap;border:1.5px solid #E6E6E6;border-radius:100px;padding:10px 14px;text-decoration:none\">Chỉ đường\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-for>\n  \u003c/div>\n\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { pos: null, status: 'idle', brand: 'all', area: '' };\n  }\n\n  dealers() {\n    // Nguồn: phattien.vn/he-thong-dai-ly, chỉ đại lý ôtô. Toạ độ ước tính theo địa chỉ.\n    return [{\"id\": \"d0\", \"g\": \"honda-oto\", \"group\": \"Honda Ôtô\", \"name\": \"Honda Ôtô Sài Gòn – Quận 2\", \"addr\": \"136D Mai Chí Thọ, P. Bình Trưng, TP.HCM\", \"lat\": 10.788, \"lng\": 106.74}, {\"id\": \"d1\", \"g\": \"honda-oto\", \"group\": \"Honda Ôtô\", \"name\": \"Honda Ôtô Đồng Nai – Biên Hoà\", \"addr\": \"B04 KP3, Khu thương mại Amata, P. Long Bình, Đồng Nai\", \"lat\": 10.948, \"lng\": 106.871}, {\"id\": \"d2\", \"g\": \"honda-oto\", \"group\": \"Honda Ôtô\", \"name\": \"Honda Ôtô Long An – Tân An\", \"addr\": \"86 Quốc lộ 1 (tuyến tránh), P. Long An, Tây Ninh\", \"lat\": 10.544, \"lng\": 106.402}, {\"id\": \"d3\", \"g\": \"honda-oto\", \"group\": \"Honda Ôtô\", \"name\": \"Honda Ôtô Tây Ninh – Hoà Thành\", \"addr\": \"KP Hiệp Hoà, P. Thanh Điền, Tây Ninh\", \"lat\": 11.286, \"lng\": 106.13}, {\"id\": \"d5\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota Ninh Kiều\", \"addr\": \"57 (59A) Cách Mạng Tháng Tám, P. Cái Khế, TP. Cần Thơ\", \"lat\": 10.048, \"lng\": 105.778}, {\"id\": \"d6\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota Tiền Giang\", \"addr\": \"Ấp Long Tường, X. Châu Thành, Đồng Tháp\", \"lat\": 10.35, \"lng\": 106.3}, {\"id\": \"d7\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota Bến Tre\", \"addr\": \"186A, KP Phước Thạnh, P. Sơn Đông, Vĩnh Long\", \"lat\": 10.256, \"lng\": 106.35}, {\"id\": \"d8\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota An Sương\", \"addr\": \"382 Lê Quang Đạo, P. Trung Mỹ Tây, TP.HCM\", \"lat\": 10.856, \"lng\": 106.615}, {\"id\": \"d9\", \"g\": \"toyota\", \"group\": \"Toyota\", \"name\": \"Toyota An Sương – CN Trường Chinh\", \"addr\": \"113 Trường Chinh, P. Đông Hưng Thuận, TP.HCM\", \"lat\": 10.829, \"lng\": 106.623}, {\"id\": \"d10\", \"g\": \"mitsubishi\", \"group\": \"Mitsubishi Motors\", \"name\": \"Mitsubishi Vĩnh Long\", \"addr\": \"Tổ 10, Ấp Tân Hưng, X. Tân Hạnh, Vĩnh Long\", \"lat\": 10.23, \"lng\": 105.935}];\n  }\n\n  areas() {\n    return [{\"id\": \"hcm\", \"label\": \"TP. Hồ Chí Minh (trung tâm)\", \"lat\": 10.7769, \"lng\": 106.7009}, {\"id\": \"dongnai\", \"label\": \"Đồng Nai – Biên Hoà\", \"lat\": 10.9574, \"lng\": 106.8427}, {\"id\": \"longan\", \"label\": \"Long An – Tân An\", \"lat\": 10.5354, \"lng\": 106.4137}, {\"id\": \"tayninh\", \"label\": \"Tây Ninh\", \"lat\": 11.31, \"lng\": 106.0983}, {\"id\": \"cantho\", \"label\": \"Cần Thơ\", \"lat\": 10.0452, \"lng\": 105.7469}, {\"id\": \"vinhlong\", \"label\": \"Vĩnh Long\", \"lat\": 10.2537, \"lng\": 105.9722}, {\"id\": \"mytho\", \"label\": \"Mỹ Tho\", \"lat\": 10.36, \"lng\": 106.36}, {\"id\": \"bentre\", \"label\": \"Bến Tre\", \"lat\": 10.2433, \"lng\": 106.3756}];\n  }\n\n  brandList() {\n    return [{\"id\": \"all\", \"label\": \"Tất cả\"}, {\"id\": \"honda-oto\", \"label\": \"Honda Ôtô\"}, {\"id\": \"toyota\", \"label\": \"Toyota\"}, {\"id\": \"mitsubishi\", \"label\": \"Mitsubishi Motors\"}];\n  }\n\n  distanceKm(a, b) {\n    const R = 6371, rad = Math.PI / 180;\n    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;\n    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;\n    return 2 * R * Math.asin(Math.sqrt(h));\n  }\n\n  renderVals() {\n    const { pos, status, brand, area } = this.state;\n    let list = this.dealers().filter((d) => brand === 'all' || d.g === brand);\n    list = list.map((d) => ({ ...d, dist: pos ? this.distanceKm(pos, d) : null }));\n    if (pos) list.sort((a, b) => a.dist - b.dist);\n    const shown = list.slice(0, 6);\n    const nearest = pos && list.length ? list[0] : null;\n    const areaObj = this.areas().find((a) => a.id === area);\n    const statusMap = {\n      idle: 'Cho phép truy cập vị trí, hoặc chọn khu vực bên dưới để xếp đại lý từ gần đến xa.',\n      loading: 'Đang lấy vị trí của bạn…',\n      ok: 'Đã lấy vị trí hiện tại của bạn.',\n      area: 'Đang tính từ trung tâm khu vực: ' + (areaObj ? areaObj.label : ''),\n      denied: 'Không lấy được vị trí (bị chặn hoặc hết thời gian). Hãy chọn khu vực bên dưới.',\n      unsupported: 'Trình duyệt không hỗ trợ định vị. Hãy chọn khu vực bên dưới.'\n    };\n    return {\n      locate: () => {\n        if (!navigator.geolocation) { this.setState({ status: 'unsupported' }); return; }\n        this.setState({ status: 'loading' });\n        try {\n          navigator.geolocation.getCurrentPosition(\n            (p) => this.setState({ pos: { lat: p.coords.latitude, lng: p.coords.longitude }, status: 'ok', area: '' }),\n            () => this.setState({ status: 'denied' }),\n            { timeout: 10000, maximumAge: 60000 }\n          );\n        } catch (e) { this.setState({ status: 'denied' }); }\n      },\n      locateLabel: status === 'loading' ? 'Đang định vị…' : (status === 'ok' ? 'Cập nhật vị trí' : 'Dùng vị trí hiện tại của tôi'),\n      statusText: statusMap[status],\n      statusColor: status === 'denied' || status === 'unsupported' ? '#C40016' : '#555555',\n      areaValue: area,\n      onArea: (e) => {\n        const a = this.areas().find((x) => x.id === e.target.value);\n        if (a) this.setState({ pos: { lat: a.lat, lng: a.lng }, status: 'area', area: a.id });\n        else this.setState({ pos: null, status: 'idle', area: '' });\n      },\n      brands: this.brandList().map((b) => {\n        const on = b.id === brand;\n        return { label: b.label, border: on ? '#E3121B' : '#E6E6E6', bg: on ? '#E3121B' : '#FFFFFF', color: on ? '#FFFFFF' : '#000000', pick: () => this.setState({ brand: b.id }) };\n      }),\n      nearestName: nearest ? nearest.name : 'Chưa có vị trí',\n      nearestDist: nearest ? '~' + nearest.dist.toFixed(1) + ' km' : '— km',\n      listTitle: pos ? 'Đại lý gần bạn nhất' : 'Danh sách đại lý',\n      listCount: 'Hiển thị ' + shown.length + '/' + list.length,\n      results: shown.map((d, i) => {\n        const top = pos && i === 0;\n        return {\n          rank: pos ? String(i + 1) : '•',\n          rankBg: top ? '#E3121B' : '#F4F4F4',\n          rankColor: top ? '#FFFFFF' : '#000000',\n          border: top ? '#E3121B' : '#EEEEEE',\n          bg: top ? '#FFF1F2' : '#FFFFFF',\n          group: d.group.toUpperCase(),\n          name: d.name,\n          addr: d.addr,\n          dist: d.dist != null ? '~' + d.dist.toFixed(1) + ' km' : '—',\n          mapUrl: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(d.name + ', ' + d.addr)\n        };\n      })\n    };\n  }\n}\n"}};</script>
